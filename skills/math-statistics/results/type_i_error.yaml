id: testing.type_i_error
node: type_i_error
status_label: definition
display: 'A Type I error is rejecting H0 when it is true (probability <= the size alpha); a Type II error is failing to reject H0 when it is false (probability 1 - power at that alternative).'
parseable: 'Type I: reject | H0 true  (rate <= alpha);   Type II: accept | H1 true  (rate = 1 - beta_phi(theta_1))'
symbols:
  'alpha': 'the tolerated Type I rate'
  '1 - beta_phi(theta_1)': 'the Type II rate at alternative theta_1'
type_check_status: well_formed
type_check_note: 'The two error kinds, treated asymmetrically: alpha is fixed by convention (0.05, 0.01, 5 sigma), power is then maximized. Which error is ''Type I'' depends on which hypothesis is labelled the null -- a modelling choice reflecting which mistake is worse.'
hypotheses: []
preconditions: []
dependencies:
  - 'power_function'
  - 'size_of_test'
uses_choice: false
constructive: true
specialization_cases:
  - 'drug trial: Type I = approve an ineffective drug (H0: no effect); Type II = miss an effective one'
  - 'the trade-off at fixed n: lowering alpha raises the Type II rate; only increasing n lowers both'
  - '5-sigma in particle physics: alpha ~ 3e-7, an extremely low Type I tolerance'
counterexamples_when_dropped:
  H0_is_the_costlier_false_positive: 'if the roles are mislabelled, the procedure rigidly protects the wrong error -- e.g. an equivalence trial must put ''the treatments differ'' style framing correctly (H0: not equivalent)'
common_misuse:
  - 'treating a non-significant result as proof of H0 (ignoring the uncontrolled Type II rate)'
  - 'running many tests and reporting the significant ones without multiplicity adjustment -- the family-wise Type I rate balloons'
related:
  uses: ['size_of_test', 'power_function']
sources:
  - 'lehmann_romano_tsh'
  - 'neyman_pearson_1933'
status: draft
checks:
  type: validation/type-checks.md#type_i_error
  specialization: validation/specialization-cases.md#type_i_error
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#type_i_error
