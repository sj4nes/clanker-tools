id: model.likelihood_function
node: likelihood_function
status_label: definition
display: 'The likelihood function is L(theta) = L(theta; x) = prod_{i=1}^n f(x_i; theta), the joint density evaluated at the observed data and read as a function of theta for fixed x.'
parseable: 'L(theta) = prod_{i=1}^n f(x_i; theta), argument theta, data x fixed'
symbols:
  'L(theta)': 'the likelihood, type: nonnegative function on Theta (NOT a density in theta -- it need not integrate to 1)'
  'f(x_i; theta)': 'the density of one observation'
  'x = (x_1,...,x_n)': 'the observed (now fixed) data'
type_check_status: well_formed
type_check_note: 'L: Theta -> [0, inf). It is a function of theta, not a probability distribution over theta. Two data sets with proportional likelihoods (same L up to a theta-free constant) carry the same likelihood information.'
hypotheses: []
preconditions: []
dependencies:
  - 'dominated_family'
  - 'iid_sample'
  - 'prob_joint_distribution'
well_definedness: 'Requires the dominated_family condition so the f(.; theta) are densities against one mu. L is defined up to the theta-free multiplicative constant coming from the choice of mu.'
uses_choice: false
constructive: true
specialization_cases:
  - 'n iid Bernoulli(p): L(p) = p^{sum x_i} (1-p)^{n - sum x_i}'
  - 'n iid N(mu, sigma^2): L(mu, sigma^2) = (2 pi sigma^2)^{-n/2} exp(- sum (x_i - mu)^2 / 2 sigma^2)'
  - 'uniform(0, theta): L(theta) = theta^{-n} 1{ theta >= max x_i } -- not differentiable at the MLE'
counterexamples_when_dropped:
  dominated_family: 'without a common dominating measure the products f(x_i; theta) for different theta are not comparable and ''maximize the likelihood'' is meaningless'
common_misuse:
  - 'reading L(theta) as a posterior density -- it becomes one only after multiplying by a prior and normalizing (Bayes)'
  - 'reading L(theta_1)/L(theta_2) as odds on theta without a prior'
  - 'dropping the indicator / support factor (uniform, shifted exponential) and getting the wrong MLE'
applications:
  - 'the single object the likelihood principle says all inference should depend on'
  - 'every MLE, LRT, Wald and score procedure, and every Bayesian posterior is built from it'
related:
  required_by: ['log_likelihood', 'maximum_likelihood_estimator', 'neyman_pearson_lemma', 'likelihood_ratio_test']
  commonly_confused_with: ['prob_pdf']
sources:
  - 'casella_berger_2e'
  - 'cox_hinkley_theoretical_statistics'
status: reviewed
checks:
  type: validation/type-checks.md#likelihood_function
  specialization: validation/specialization-cases.md#likelihood_function
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#likelihood_function
