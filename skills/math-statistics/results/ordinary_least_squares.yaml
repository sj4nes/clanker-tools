id: regression.ordinary_least_squares
node: ordinary_least_squares
status_label: definition
display: 'The ordinary least squares estimator is beta_hat = argmin_{b in R^p} || y - X b ||^2: the coefficient vector minimizing the residual sum of squares.'
parseable: 'beta_hat = argmin_{b} || y - X b ||^2'
symbols:
  '|| y - X b ||^2 = sum_i (y_i - x_i^T b)^2': 'the least-squares criterion'
  'beta_hat = (X^T X)^{-1} X^T y': 'the closed-form solution (normal_equations)'
type_check_status: well_formed
type_check_note: 'A definition via an optimization problem. The objective is strictly convex in b when X has full column rank, so the minimizer is unique and given by the normal equations. OLS = MLE under Gaussian errors; OLS = method of moments for the moment condition E[X eps] = 0.'
hypotheses: []
preconditions: []
dependencies:
  - 'linear_model'
  - 'ra_differentiability'
uses_choice: false
constructive: true
specialization_cases:
  - 'p = 1, no intercept: beta_hat = sum x_i y_i / sum x_i^2'
  - 'simple regression: slope = Cov_hat(x, y)/Var_hat(x), intercept = ybar - slope xbar'
  - 'OLS = MLE of beta under eps ~ N(0, sigma^2 I) (maximizing the Gaussian likelihood minimizes the SSE)'
counterexamples_when_dropped:
  full_rank_X: 'collinear X: the argmin is a whole affine subspace; OLS is undefined (ridge / pseudoinverse picks the minimum-norm solution)'
common_misuse:
  - 'fitting OLS with more predictors than observations (p > n) -- no unique solution, need regularization'
  - 'including a variable and its exact linear function (dummy-variable trap)'
  - 'interpreting a coefficient''s sign/magnitude without noting it is ''holding the other X fixed'', which may be impossible in the data'
related:
  required_by: ['normal_equations', 'gauss_markov_theorem', 'partitioned_regression']
  uses: ['linear_model']
  special_case_of: []
sources:
  - 'seber_lee_linear_regression'
  - 'casella_berger_2e'
status: reviewed
checks:
  type: validation/type-checks.md#ordinary_least_squares
  specialization: validation/specialization-cases.md#ordinary_least_squares
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#ordinary_least_squares
