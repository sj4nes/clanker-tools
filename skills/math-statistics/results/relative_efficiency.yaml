id: estimation.relative_efficiency
node: relative_efficiency
status_label: definition
display: 'The asymptotic relative efficiency of estimator A to estimator B (both sqrt(n)-normal for the same estimand) is ARE(A, B) = AVar(B) / AVar(A); A is more efficient when ARE > 1.'
parseable: 'ARE(A, B) = AVar_B(theta) / AVar_A(theta)'
regime: asymptotic
symbols:
  'ARE': 'asymptotic relative efficiency, type: positive real (may depend on theta)'
type_check_status: well_formed
type_check_note: 'A ratio of asymptotic variances. ARE(A, B) = c means B needs about 1/c times as many observations as A to match precision (large n).'
hypotheses: []
preconditions: []
dependencies:
  - 'asymptotic_variance'
uses_choice: false
constructive: true
specialization_cases:
  - 'sample mean vs sample median for a NORMAL location: ARE(median, mean) = 2/pi ~ 0.64 -- the median wastes ~36% of the data'
  - 'for a Laplace (double-exponential) location: ARE(median, mean) = 2 -- the median is twice as efficient'
  - 'for t_3 errors the median beats the mean; the crossover is around ''tails heavier than t_5'''
counterexamples_when_dropped:
  same_rate: 'comparing a sqrt(n) estimator to an n-rate estimator (uniform endpoint) by an ARE is meaningless -- the ratio degenerates to 0 or inf'
common_misuse:
  - 'quoting a single ARE number when it depends on the (unknown) error distribution'
  - 'ignoring finite-sample robustness -- an efficient-at-the-normal estimator can be terrible under contamination'
related:
  generalizes_from: ['asymptotic_variance']
sources:
  - 'van_der_vaart_asymptotic'
  - 'lehmann_casella_tpe'
status: draft
checks:
  type: validation/type-checks.md#relative_efficiency
  specialization: validation/specialization-cases.md#relative_efficiency
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#relative_efficiency
