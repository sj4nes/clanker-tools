id: decision_theory.admissibility
node: admissibility
status_label: definition
display: 'A decision rule delta is admissible if no rule delta'' has R(theta, delta'') <= R(theta, delta) for all theta with strict inequality for some theta; otherwise delta is inadmissible (dominated).'
parseable: 'delta admissible  <=>  no delta'' with R(., delta'') <= R(., delta) everywhere and < somewhere'
symbols:
  '''delta'' dominates delta''': 'R(., delta'') <= R(., delta) with strict somewhere -- a free lunch'
type_check_status: well_formed
type_check_note: 'A minimal-competence criterion: an inadmissible rule can be strictly improved everywhere at no cost, so it should not be used. Admissibility does NOT single out a good rule (silly rules like delta = c are often admissible).'
hypotheses: []
preconditions: []
dependencies:
  - 'risk_function'
uses_choice: false
constructive: true
specialization_cases:
  - 'Xbar is admissible for a 1- or 2-dimensional normal mean under squared-error loss'
  - 'every unique Bayes rule is admissible; a Bayes rule with continuous risk is admissible'
  - 'a constant estimator delta = c is admissible (nothing beats it at theta = c) -- admissibility alone is weak'
counterexamples_when_dropped:
  dimension: 'Xbar is INADMISSIBLE for a normal mean in dimension d >= 3 -- the James-Stein estimator dominates it everywhere (james_stein). This is the famous Stein paradox.'
common_misuse:
  - 'treating admissibility as a strong endorsement -- it rules out the obviously-wasteful, nothing more'
  - 'assuming the MLE / UMVUE is admissible -- it often is not in multiparameter problems'
related:
  required_by: ['complete_class', 'james_stein']
  uses: ['risk_function']
sources:
  - 'berger_statistical_decision_theory'
  - 'lehmann_casella_tpe'
status: draft
checks:
  type: validation/type-checks.md#admissibility
  specialization: validation/specialization-cases.md#admissibility
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#admissibility
