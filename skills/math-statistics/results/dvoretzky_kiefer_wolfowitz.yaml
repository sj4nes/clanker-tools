  type: validation/type-checks.md#dvoretzky_kiefer_wolfowitz
  specialization: validation/specialization-cases.md#dvoretzky_kiefer_wolfowitz
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#dvoretzky_kiefer_wolfowitz
