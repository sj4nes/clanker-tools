id: exponential_family.cumulant_function
node: cumulant_function
status_label: definition
display: 'A(eta) = log int h(x) exp(eta . T(x)) dmu(x): the log of the normalizing constant, a convex function on H, analytic on int(H).'
parseable: 'A(eta) = log int h(x) e^{eta . T(x)} dmu(x)'
symbols:
  'A(eta)': 'the cumulant / log-partition function, type: convex real function on H'
  'grad A(eta)': '= E_eta[T(X)], the mean-value map'
  'Hess A(eta)': '= Cov_eta(T(X)), positive semidefinite (definite in the minimal representation)'
type_check_status: well_formed
type_check_note: 'Convex (Holder); strictly convex in a minimal representation. Its gradient and Hessian are the first two cumulants of T -- see exponential_family_moment_identities.'
hypotheses: []
preconditions: []
dependencies:
  - 'exponential_family'
  - 'natural_parameter_space'
well_definedness: 'A(eta) is finite exactly on H and determines the family given (h, T, mu).'
uses_choice: false
constructive: true
specialization_cases:
  - 'Bernoulli: A(eta) = log(1 + e^eta); A''(eta) = e^eta/(1+e^eta) = p; A''''(eta) = p(1-p)'
  - 'N(mu, sigma^2), eta_1 = mu/sigma^2: partial in eta_1 recovers mu'
  - 'Poisson: A(eta) = e^eta = lambda; A'' = A'''' = lambda (mean = variance)'
counterexamples_when_dropped:
  none_all_hypotheses_essential: 'every listed hypothesis is used; see the block above'
common_misuse:
  - 'confusing A(eta) (the log-partition) with the cumulant GENERATING function of X'
  - 'differentiating A outside int(H)'
related:
  required_by: ['exponential_family_moment_identities', 'mean_value_parametrization']
sources:
  - 'brown_exponential_families'
  - 'wainwright_jordan_graphical_models'
status: draft
checks:
  type: validation/type-checks.md#cumulant_function
  specialization: validation/specialization-cases.md#cumulant_function
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#cumulant_function
