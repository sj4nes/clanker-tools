id: regression.unbiased_error_variance_estimator
node: unbiased_error_variance_estimator
status_label: proposition
display: 'In the linear model, sigma_hat^2 = RSS / (n - p) is unbiased for sigma^2: E[sigma_hat^2] = sigma^2, for any error distribution with mean 0, variance sigma^2, and uncorrelated components (no normality needed).'
parseable: 'sigma_hat^2 = RSS / (n - p),   E[sigma_hat^2] = sigma^2'
regime: exact
symbols:
  'n - p': 'the residual / error degrees of freedom -- observations minus fitted parameters'
  'the MLE (Gaussian) divides by n': 'and is biased low by a factor (n-p)/n'
type_check_status: well_formed
type_check_note: 'An exact identity, distribution-free (only E[eps]=0, Cov(eps) = sigma^2 I needed). Proof: E[RSS] = E[eps^T (I - H) eps] = sigma^2 tr(I - H) = sigma^2 (n - p). The regression generalization of bias_of_sample_variance (which is the p = 1, X = 1 case, giving n - 1).'
hypotheses: []
preconditions: []
dependencies:
  - 'linear_algebra_background'
  - 'prob_expectation_linearity'
  - 'residual_sum_of_squares'
proof:
  technique: 'E[eps^T A eps] = sigma^2 tr(A) for Cov(eps) = sigma^2 I; here A = I - H, tr(I - H) = n - p'
  derives_from: 'prob_expectation_linearity'
  lean_status: instance
  lean_ref: 'validation/proof-checks.lean Stat.rss_expectation -- E[eps^T(I-H)eps] = sigma^2 tr(I-H); the trace identity tr(I - H) = n - p for a fixed integer design via decide, reusing Stat.bias_sample_var''s E[quadratic form] algebra'
uses_choice: false
constructive: true
specialization_cases:
  - 'p = 1 (intercept only): n - p = n - 1, recovers S^2 (bias_of_sample_variance)'
  - 'sigma_hat = sqrt(sigma_hat^2) is the ''residual standard error'' printed in every regression summary'
  - 'the SEs of the coefficients are sigma_hat sqrt( ((X^T X)^{-1})_jj )'
counterexamples_when_dropped:
  Cov(eps) = sigma^2 I: 'heteroskedastic or autocorrelated errors: E[RSS/(n-p)] != sigma^2 (there is no single sigma^2); the model-based SEs are wrong -- use White / Newey-West robust SEs'
  correct_mean_model: 'omitted nonlinearity inflates RSS, so sigma_hat^2 is biased UP -- the lack-of-fit test exploits this'
common_misuse:
  - 'using the divisor n (the MLE) and reporting biased-low SEs'
  - 'trusting sigma_hat^2 and the coefficient SEs when residual plots show non-constant variance'
related:
  uses: ['residual_sum_of_squares', 'prob_expectation_linearity', 'linear_algebra_background']
  generalizes_from: ['bias_of_sample_variance']
sources:
  - 'seber_lee_linear_regression'
  - 'casella_berger_2e'
status: draft
checks:
  type: validation/type-checks.md#unbiased_error_variance_estimator
  specialization: validation/specialization-cases.md#unbiased_error_variance_estimator
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#unbiased_error_variance_estimator
