id: differentiation.mean_value_theorem
node: mean_value_theorem
status_label: nonconstructive_result
display: 'If $f$ is continuous on $[a,b]$ and differentiable on $(a,b)$, then $f''(c) = \dfrac{f(b)-f(a)}{b-a}$ for some $c\in(a,b)$.'
parseable: 'continuousOn(f,[a,b]) and differentiableOn(f,(a,b)) -> exists c in (a,b), deriv f c = (f b - f a)/(b - a)'
symbols:
  f: { meaning: a real function, type: function }
  c: { meaning: the mean-value point, type: real }
type_check_status: well_formed
hypotheses: [continuity_on_closed_interval, differentiability_on_open_interval]
preconditions: [a_lt_b]
dependencies: [rolles_theorem]
proof:
  technique: >-
    apply rolles_theorem to h(x) = f(x) - f(a) - s (x - a) with
    s = (f(b)-f(a))/(b-a); h(a) = h(b) = 0, so h'(c) = 0, i.e. f'(c) = s.
  derives_from: rolles_theorem
  lean_status: instance
  lean_ref: 'validation/proof-checks.lean §9 (h(a)=h(b)=0 endpoint identity)'
uses_choice: false
constructive: false
solving_for: null
specialization_cases:
  - 'f(a) = f(b) => Rolle (c with f''(c) = 0)'
  - 'g(x) = x in Cauchy MVT => this theorem'
  - 'f(x) = x^2 on [1,3]: slope 4, f''(c) = 2c = 4 => c = 2 (instance-checks.bc)'
counterexamples_when_dropped:
  continuity_on_closed_interval: 'f(x)=x on (0,1], f(0):=1 — no c with f''(c) = (f(1)-f(0))/1 = 0'
  differentiability_on_open_interval: 'f(x) = |x| on [-1,1] — secant slope 0, f'' = +-1 wherever defined'
common_misuse:
  - 'assuming c is unique'
  - 'using it to solve for c explicitly (it is an existence statement)'
  - 'applying to a complex- or vector-valued f (fails: (cos t, sin t) on [0,2pi])'
related:
  special_case_of: cauchy_mean_value_theorem
  generalized_by: taylor_theorem
sources: [rudin_principles_3e, spivak_calculus_4e, bartle_sherbert_4e]
status: reviewed
checks:
  type: validation/type-checks.md#mean_value_theorem
  specialization: validation/specialization-cases.md#mean_value_theorem
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md
