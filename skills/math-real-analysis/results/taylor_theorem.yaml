id: differentiation.taylor_theorem
node: taylor_theorem
status_label: nonconstructive_result
display: 'If $f$ is $n$ times differentiable on an interval containing $a,x$, then $f(x)=\sum_{k=0}^{n-1}\frac{f^{(k)}(a)}{k!}(x-a)^k+\frac{f^{(n)}(\xi)}{n!}(x-a)^n$ for some $\xi$ strictly between $a$ and $x$.'
parseable: 'f(x) = sum_{k<n} f^{(k)}(a)(x-a)^k/k! + f^{(n)}(xi)(x-a)^n/n!'
symbols:
  f: { meaning: an n-times-differentiable real function, type: function }
  n: { meaning: the order, type: 'nat, n >= 1' }
  a: { meaning: the expansion point, type: real }
  xi: { meaning: the (unknown) point in the Lagrange remainder, type: real }
type_check_status: well_formed
hypotheses: [f_n_times_differentiable_on_interval]
preconditions: [a_ne_x]
dependencies: [mean_value_theorem, rolles_theorem, derivative, induction]
proof:
  technique: >-
    fix x; choose M so that P(t) = sum_{k<n} f^{(k)}(t)(x-t)^k/k! + M (x-t)^n
    satisfies P(a) = f(x). Then g(t) = f(x) - P(t) has g(a) = g(x) = 0, so by
    Rolle g'(c) = 0 for some c; g'(t) telescopes to
    -(f^{(n)}(t)/(n-1)! - n M)(x-t)^{n-1}, giving M = f^{(n)}(c)/n!.
  derives_from: rolles_theorem
  lean_status: instance
  lean_ref: 'validation/proof-checks.lean §7 (2nd-order remainder for f = x^2)'
uses_choice: false
constructive: false
solving_for: null
specialization_cases:
  - 'n = 1: exactly the mean value theorem'
  - 'f a polynomial of degree < n: remainder is 0'
  - 'e^x at 0, degree 4: |R_4(1)| ~ 0.00995 < e/120 ~ 0.0227 (instance-checks.bc)'
counterexamples_when_dropped:
  f_n_times_differentiable_on_interval: 'f(x) = x^2 sin(1/x), f(0)=0: differentiable once, f'''' undefined at 0 — no 2nd-order Lagrange remainder there'
  smoothness_vs_analyticity: 'f(x)=e^{-1/x^2} (f(0)=0) is C^infinity with all f^{(k)}(0)=0, so the Taylor SERIES is 0 though f is not — Taylor''s theorem (finite, with remainder) still holds; the infinite series need not converge to f'
common_misuse:
  - 'confusing the finite Taylor polynomial + remainder (always valid for C^n f) with the Taylor series (needs R_n -> 0)'
  - 'assuming xi is computable or unique'
related:
  generalizes: mean_value_theorem
  approximates: 'analytic_function (edges/relations.tsv)'
sources: [spivak_calculus_4e, rudin_principles_3e]
status: reviewed
checks:
  type: validation/type-checks.md
  specialization: validation/specialization-cases.md#taylor_theorem
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md
