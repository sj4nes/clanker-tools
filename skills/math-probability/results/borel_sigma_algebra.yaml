id: measure.borel_sigma_algebra
node: borel_sigma_algebra
status_label: definition
display: 'B(R) is the sigma-algebra generated by the open intervals of R (equivalently by the open sets, or by the half-lines (-inf, x]). B(R^d) is generated by the open boxes.'
parseable: 'B(R) = sigma({ open intervals }) = sigma({ (-inf, x] : x in R })'
symbols:
  'B(R)': 'the Borel sets of R, type: sigma-algebra on R'
  'R^d': 'Euclidean d-space, type: set'
type_check_status: well_formed
type_check_note: 'the half-lines form a pi-system generating B(R); this is why a CDF (a function of the half-lines) determines the whole law. Every set one can ''write down'' -- intervals, countable unions, F-sigma, G-delta -- is Borel.'
hypotheses: []
preconditions: []
dependencies:
  - 'generated_sigma_algebra'
  - 'real_field'
well_definedness: 'all listed generating collections yield the same sigma-algebra (each contains a countable subfamily generating the others); B(R) is a proper subset of 2^R (a Vitali set is not Borel, using AC).'
uses_choice: false
constructive: true
specialization_cases:
  - 'singletons {x} = bigcap_n (x-1/n, x+1/n) are Borel, so every countable set is Borel and Borel-null under Lebesgue measure'
  - 'B(R^d) = B(R) tensor ... tensor B(R), the product sigma-algebra'
counterexamples_when_dropped:
  generated_by_a_pi_system: 'if one generates from a collection that is not a pi-system, the pi-lambda uniqueness argument for measures fails'
common_misuse:
  - 'assuming every subset of R is Borel'
  - 'confusing Borel with Lebesgue-measurable (the latter is the completion, strictly larger)'
related:
  special_case_of: ['generated_sigma_algebra']
  completed_to: ['Lebesgue sigma-algebra']
sources:
  - 'billingsley_probability_measure'
  - 'folland_real_analysis'
status: reviewed
checks:
  type: validation/type-checks.md#borel_sigma_algebra
  specialization: validation/specialization-cases.md#borel_sigma_algebra
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#borel_sigma_algebra
