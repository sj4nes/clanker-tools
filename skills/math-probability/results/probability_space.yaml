id: probability_space.probability_space
node: probability_space
status_label: definition
display: 'A probability space is a triple (Omega, F, P): a sample space Omega, an event sigma-algebra F, and a probability measure P on F.'
parseable: '(Omega, F, P) with F a sigma-algebra and P a probability measure'
symbols:
  'Omega': 'sample space, type: set'
  'F': 'events, type: sigma-algebra'
  'P': 'probability, type: F -> [0,1]'
type_check_status: well_formed
type_check_note: 'the single object every probabilistic statement is implicitly relative to. Random variables are measurable maps out of it; independence and conditioning are properties of sub-sigma-algebras of F.'
hypotheses: []
preconditions: []
dependencies:
  - 'measurable_space'
  - 'probability_measure'
well_definedness: 'any (Omega, F) with any probability measure P is a probability space; the canonical one for a real random variable with law mu is (R, B(R), mu).'
uses_choice: false
constructive: true
specialization_cases:
  - '([0,1], B, lambda): supports a random variable of ANY law via the quantile transform (probability_integral_transform)'
  - '(Omega, {empty, Omega}, P): only P(empty)=0, P(Omega)=1 -- no non-trivial events'
counterexamples_when_dropped:
  F_a_sigma_algebra: 'if F is only an algebra, countable additivity has no content and the limit theorems (which are about countable families) cannot even be stated'
common_misuse:
  - 'changing Omega mid-argument without a coupling'
  - 'assuming a single Omega carries an uncountable family of independent variables without checking (it can, but needs a product construction)'
related:
  used_by: ['random_variable', 'stochastic_process']
sources:
  - 'billingsley_probability_measure'
  - 'durrett_pte'
status: reviewed
checks:
  type: validation/type-checks.md#probability_space
  specialization: validation/specialization-cases.md#probability_space
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#probability_space
