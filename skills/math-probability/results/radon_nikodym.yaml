id: measure.radon_nikodym
node: radon_nikodym
status_label: proved_theorem
display: 'If nu << mu (nu(A) = 0 whenever mu(A) = 0) with mu, nu sigma-finite, there is a mu-a.e.-unique measurable h >= 0 with nu(A) = integral_A h dmu. h = dnu/dmu.'
parseable: 'nu << mu, sigma-finite  =>  exists h >= 0, nu(A) = integral_A h dmu  (h a.e. unique)'
symbols:
  'f_n, f': 'measurable functions, type: Omega -> R'
  'mu': 'a (sigma-finite) measure, type: measure'
type_check_status: well_formed
type_check_note: 'CITED. The exchange-of-limit toolkit for the integral; each is stated for a general measure and specialised to P for expectations (MCT/DCT/Fatou for E, Fubini for E[XY] and convolutions).'
hypotheses: []
preconditions: []
dependencies:
  - 'abstract_integral'
  - 'measure'
proof:
  technique: 'cited construction from the abstract integral'
  derives_from: 'abstract_integral'
  lean_status: cited
  lean_ref: 'Folland Real Analysis 2e ch. 2; Billingsley SS16'
uses_choice: false
constructive: true
specialization_cases:
  - 'mu = P: the probability form used for E[lim] = lim E, differentiating an MGF, and Scheffe''s lemma'
counterexamples_when_dropped:
  absolute_continuity_nu_ll_mu: 'nu = delta_0, mu = Lebesgue on R: nu({0}) = 1 but mu({0}) = 0, so nu is NOT << mu and has no density; nu is purely singular'
common_misuse:
  - 'applying the wrong theorem for the situation (MCT needs monotone; DCT needs a dominator; Fatou only gives an inequality)'
