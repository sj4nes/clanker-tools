id: independence.independence_random_variables
node: independence_random_variables
status_label: definition
display: 'Random variables X_1, ..., X_n are independent if the sigma-algebras sigma(X_1), ..., sigma(X_n) are independent; equivalently P(X_1 in B_1, ..., X_n in B_n) = prod_i P(X_i in B_i) for all Borel B_i; equivalently the joint law is the product of the marginals.'
parseable: 'P(X_1 in B_1, ..., X_n in B_n) = prod_i P(X_i in B_i)   for all Borel B_i'
symbols:
  'X_i': 'random variables, type: Omega -> R'
  'B_i': 'Borel sets, type: element of B(R)'
type_check_status: well_formed
type_check_note: 'the sets { X_i in B_i } for B_i Borel form a generating pi-system for sigma(X_i), so factorization on rectangles (checked via CDFs or densities) is enough by pi-lambda. Functions of disjoint independent blocks stay independent.'
hypotheses: []
preconditions: []
dependencies:
  - 'distribution_pushforward'
  - 'independence_sigma_algebras'
  - 'joint_distribution'
  - 'random_variable'
well_definedness: 'the product measure P_{X_1} tensor ... tensor P_{X_n} exists and is a probability measure on B(R^n); independence says the joint law equals it.'
uses_choice: false
constructive: true
specialization_cases:
  - 'densities factorize: f_{X_1,...,X_n}(x) = prod_i f_{X_i}(x_i) (independence_factorization)'
  - 'g_1(X_1), ..., g_n(X_n) are independent for any measurable g_i'
  - 'iid = independent + identically distributed'
counterexamples_when_dropped:
  all_n_together_not_just_pairs: 'three variables can be pairwise independent but not mutually independent -- e.g. X_1, X_2 iid uniform on {-1,1}, X_3 = X_1 X_2'
  the_joint_law_not_just_marginals: 'same marginals, different dependence: (X, X) vs (X, -X) vs (X, Y independent)'
common_misuse:
  - 'inferring independence from zero correlation (uncorrelated_not_independent)'
  - 'assuming a function of ALL the X_i stays independent of another such function'
related:
  special_case: ['iid']
  checked_by: ['independence_factorization']
  implies: ['independence_expectation']
sources:
  - 'billingsley_probability_measure'
  - 'durrett_pte'
status: reviewed
checks:
  type: validation/type-checks.md#independence_random_variables
  specialization: validation/specialization-cases.md#independence_random_variables
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#independence_random_variables
