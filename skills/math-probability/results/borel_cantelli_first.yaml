id: probability_space.borel_cantelli_first
node: borel_cantelli_first
status_label: proved_theorem
display: 'If sum_n P(A_n) < inf, then P(A_n infinitely often) = 0; i.e. almost surely only finitely many A_n occur.'
parseable: 'sum_n P(A_n) < inf  =>  P(limsup_n A_n) = 0'
symbols:
  '(A_n)': 'any sequence of events (no independence), type: N -> F'
  'limsup A_n': 'the i.o. event, type: element of F'
type_check_status: well_formed
type_check_note: 'no independence needed. P(limsup A_n) = P(bigcap_N bigcup_{n>=N} A_n) <= P(bigcup_{n>=N} A_n) <= sum_{n>=N} P(A_n) -> 0 as N -> inf (tail of a convergent series).'
hypotheses: []
preconditions: []
dependencies:
  - 'boole_inequality'
  - 'continuity_of_probability'
  - 'limsup_liminf'
  - 'series_convergence'
proof:
  technique: 'monotonicity into the N-th tail union, then Boole, then let N -> inf using that the series tail vanishes'
  derives_from: 'boole_inequality'
  lean_status: core
  lean_ref: 'validation/proof-checks.lean Prob.union_bound is the Boole step'
uses_choice: false
constructive: true
specialization_cases:
  - 'A_n = { |X_n - X| > eps }: sum P < inf gives X_n -> X a.s. -- the standard route from a rate to a.s. convergence'
  - 'A_n = { X_n / n > 1 + eps } with sum P < inf: proves a.s. bounds like the SLLN''s a.s. o(n) growth'
counterexamples_when_dropped:
  none_unconditional_direction: 'the converse needs independence (borel_cantelli_second); without it sum P(A_n) = inf gives no lower bound -- take A_n all equal to a fixed A with 0 < P(A) < 1: sum diverges but P(A i.o.) = P(A) < 1'
common_misuse:
  - 'thinking it needs independence (it does not)'
  - 'concluding P(A_n i.o.) > 0 from sum P(A_n) = inf without independence'
applications:
  - 'the standard route from a convergence RATE to almost-sure convergence: if sum_n P(|X_n - X| > eps) < inf then X_n -> X a.s. -- used to prove a.s. convergence of stochastic gradient descent and of stochastic approximation (Robbins-Monro)'
  - 'the proof of the strong law of large numbers (Etemadi) and of the law of the iterated logarithm'
  - 'metric number theory: ''almost every real is normal in every base'' (Borel 1909) is a Borel-Cantelli argument'
related:
  dual_of: ['borel_cantelli_second']
  used_by: ['strong_law_large_numbers', 'convergence_implications']
sources:
  - 'billingsley_probability_measure'
  - 'durrett_pte'
status: reviewed
checks:
  type: validation/type-checks.md#borel_cantelli_first
  specialization: validation/specialization-cases.md#borel_cantelli_first
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#borel_cantelli_first
