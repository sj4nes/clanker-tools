id: distributions.cauchy_no_mean
node: cauchy_no_mean
status_label: counterexample
display: 'X ~ Cauchy: density f_X(x) = 1/(pi(1 + x^2)) on R. E[|X|] = inf, so E[X] does not exist and Var is undefined. The sample mean of n iid Cauchy variables is again Cauchy(0,1) -- it does not concentrate. The LLN and CLT both fail.'
parseable: 'f_X(x) = 1/(pi(1+x^2)) :  E[|X|] = inf ;  (X_1 + ... + X_n)/n ~ Cauchy for every n'
symbols:
  'X': 'a standard Cauchy variable, type: Omega -> R'
  'f_X': 'its density, type: R -> (0, inf)'
type_check_status: well_formed
type_check_note: 'the canonical finite-density law with no mean: the tails decay only like 1/x^2, so integral |x| f_X(x) dx = (2/pi) integral_0^inf x/(1+x^2) dx = inf. Its characteristic function phi_X(t) = e^{-|t|} exists (and is non-differentiable at 0, consistent with the missing mean).'
hypotheses: []
preconditions: []
dependencies:
  - 'abstract_integral'
  - 'expectation'
  - 'pdf'
well_definedness: 'f_X integrates to 1 (arctan), so Cauchy is a bona fide probability law; it is E[X] that fails to exist, not the distribution.'
uses_choice: false
constructive: true
specialization_cases:
  - 'ratio Z_1/Z_2 of independent standard normals is standard Cauchy'
  - 'the sample mean stays Cauchy(0,1) (phi_{Xbar}(t) = phi_X(t/n)^n = e^{-|t|}) -- averaging does not help'
  - 'the sample MEDIAN of n iid Cauchy DOES concentrate (median is well-defined) and is asymptotically normal'
counterexamples_when_dropped:
  this_IS_the_counterexample: 'it shows the finite-mean hypothesis of the WLLN/SLLN and the finite-variance hypothesis of the CLT are not removable'
common_misuse:
  - 'applying the LLN or CLT to ratios, or to data with power-law tails of index <= 1 (no mean) or <= 2 (no variance)'
  - 'reporting a sample mean and its standard error for heavy-tailed data (both are meaningless)'
  - 'assuming a symmetric unimodal density implies a mean exists'
related:
  breaks: ['weak_law_large_numbers', 'strong_law_large_numbers', 'central_limit_theorem']
  stable_law: ['index 1']
  arises_as: ['ratio of normals, tan of a uniform angle']
sources:
  - 'durrett_pte'
  - 'grimmett_stirzaker'
status: reviewed
checks:
  type: validation/type-checks.md#cauchy_no_mean
  specialization: validation/specialization-cases.md#cauchy_no_mean
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#cauchy_no_mean
