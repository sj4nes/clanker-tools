id: random_variable.probability_integral_transform
node: probability_integral_transform
status_label: proved_theorem
display: 'If F_X is continuous, then F_X(X) ~ Uniform(0,1). Conversely, for any CDF F and U ~ Uniform(0,1), the variable F^{-1}(U) has CDF F.'
parseable: 'F_X continuous => F_X(X) ~ U(0,1) ;  U ~ U(0,1) => F^{-1}(U) ~ F'
symbols:
  'X': 'a random variable with continuous CDF, type: Omega -> R'
  'U': 'a uniform variable, type: Omega -> (0,1)'
  'F': 'any target CDF, type: R -> [0,1]'
type_check_status: well_formed
type_check_note: 'the inverse direction (F^{-1}(U) ~ F) needs NO continuity and is the basis of simulation: to sample any distribution, sample a uniform and apply the quantile function.'
hypotheses: []
preconditions: []
dependencies:
  - 'cdf'
  - 'cdf_properties'
  - 'continuous_uniform_distribution'
  - 'distribution_pushforward'
  - 'quantile_function'
proof:
  technique: 'inverse: P(F^{-1}(U) <= x) = P(U <= F(x)) = F(x) by the Galois connection F^{-1}(u) <= x iff u <= F(x). Forward: if F_X continuous, P(F_X(X) <= u) = P(X <= F_X^{-1}(u)) = F_X(F_X^{-1}(u)) = u'
  derives_from: 'quantile_function'
  lean_status: cited
  lean_ref: 'Durrett Thm 1.2.2; Devroye Non-Uniform Random Variate Generation ch. 2'
uses_choice: false
constructive: true
solving_for: 'how to generate a sample from an arbitrary distribution given a uniform RNG'
specialization_cases:
  - 'F(x) = 1 - e^{-lambda x} (exponential): F^{-1}(u) = -ln(1-u)/lambda -- inversion sampling for the exponential'
  - 'F discrete: F^{-1}(U) picks value x_k when U falls in (F(x_{k-1}), F(x_k)] -- the alias/CDF method'
  - 'goodness-of-fit: if the model F is right, the transformed data F(x_i) should look Uniform(0,1) (the basis of PP-plots and the Kolmogorov-Smirnov test)'
counterexamples_when_dropped:
  continuity_of_F_X_for_the_forward_direction: 'X ~ Bernoulli(1/2): F_X(X) takes only the values 1/2 and 1, not Uniform(0,1) -- atoms in F_X break the forward transform (the inverse direction still works)'
common_misuse:
  - 'applying the forward direction to a discrete or mixed X'
  - 'forgetting to use the generalized inverse for non-invertible F'
applications:
  - 'inverse-transform sampling: F^-1(U) with U ~ Uniform(0,1) draws from ANY distribution given only a uniform RNG -- the default method in every simulation library (numpy.random, R, Boost.Random) for exponential, Cauchy, discrete, and empirical distributions (Devroye 1986)'
  - 'goodness-of-fit: if the model F is correct, the transformed data F(x_i) are Uniform(0,1) -- the basis of PP-plots and the Kolmogorov-Smirnov / Anderson-Darling tests'
  - 'copula models in quantitative finance and hydrology: separate the marginals (via the PIT) from the dependence structure'
related:
  used_by: ['simulation (inversion sampling)']
  requires: ['quantile_function']
sources:
  - 'durrett_pte'
  - 'grimmett_stirzaker'
status: reviewed
checks:
  type: validation/type-checks.md#probability_integral_transform
  specialization: validation/specialization-cases.md#probability_integral_transform
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#probability_integral_transform
