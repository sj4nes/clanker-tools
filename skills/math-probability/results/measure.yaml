id: measure.measure
node: measure
status_label: definition
display: 'A measure on (Omega, F) is a function mu: F -> [0, inf] with mu(empty) = 0 that is countably additive: for pairwise-disjoint A_1, A_2, ... in F, mu(bigcup_n A_n) = sum_n mu(A_n).'
parseable: 'mu(empty) = 0 ; disjoint (A_n) => mu(bigcup A_n) = sum mu(A_n)'
symbols:
  'mu': 'the measure, type: F -> [0, inf]'
  '(A_n)': 'a countable disjoint family, type: N -> F'
type_check_status: well_formed
type_check_note: 'countable additivity is over a COUNTABLE disjoint family; the sum is a series in [0, inf] and always has a value. mu is sigma-finite if Omega is a countable union of finite-measure sets -- the hypothesis of Radon-Nikodym and Fubini.'
hypotheses: []
preconditions: []
dependencies:
  - 'countable_set'
  - 'measurable_space'
  - 'real_field'
  - 'series_convergence'
  - 'sigma_algebra'
well_definedness: 'mu(empty) = 0 follows from countable additivity unless mu is identically +inf; monotonicity and countable subadditivity are consequences. Counting measure, Lebesgue measure, and Dirac delta_x are the standard examples.'
uses_choice: false
constructive: true
specialization_cases:
  - 'mu(Omega) = 1: a probability measure (kolmogorov_axioms)'
  - 'mu = counting measure on a countable Omega: mu(A) = |A|'
  - 'mu = delta_x: mu(A) = 1 if x in A else 0'
counterexamples_when_dropped:
  countable_additivity: 'a merely finitely additive set function (e.g. a Banach limit / finitely additive extension of density on N) is not a measure and breaks continuity from below and Borel-Cantelli'
common_misuse:
  - 'assuming finite additivity is enough'
  - 'forgetting sigma-finiteness for Radon-Nikodym / Fubini'
  - 'treating mu(A) = inf results carelessly in subtractions'
related:
  specializes_to: ['probability_measure']
  generalizes: ['finitely additive set function']
sources:
  - 'billingsley_probability_measure'
  - 'folland_real_analysis'
status: reviewed
checks:
  type: validation/type-checks.md#measure
  specialization: validation/specialization-cases.md#measure
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#measure
