id: measure.fubini_tonelli
node: fubini_tonelli
status_label: proved_theorem
display: 'For sigma-finite mu, nu: if f >= 0 (Tonelli) or f is (mu x nu)-integrable (Fubini), the double integral equals both iterated integrals.'
parseable: 'integral f d(mu x nu) = integral integral f dmu dnu = integral integral f dnu dmu'
symbols:
  'f_n, f': 'measurable functions, type: Omega -> R'
  'mu': 'a (sigma-finite) measure, type: measure'
type_check_status: well_formed
type_check_note: 'CITED. The exchange-of-limit toolkit for the integral; each is stated for a general measure and specialised to P for expectations (MCT/DCT/Fatou for E, Fubini for E[XY] and convolutions).'
hypotheses: []
preconditions: []
dependencies:
  - 'abstract_integral'
  - 'measure'
proof:
  technique: 'cited construction from the abstract integral'
  derives_from: 'abstract_integral'
  lean_status: cited
  lean_ref: 'Folland Real Analysis 2e ch. 2; Billingsley SS16'
uses_choice: false
constructive: true
specialization_cases:
  - 'mu = P: the probability form used for E[lim] = lim E, differentiating an MGF, and Scheffe''s lemma'
counterexamples_when_dropped:
  sigma_finiteness_or_integrability: 'f(x,y) = (x^2 - y^2)/(x^2 + y^2)^2 on (0,1)^2: the two iterated integrals are +pi/4 and -pi/4 -- f is not integrable, so Fubini does not apply'
common_misuse:
  - 'applying the wrong theorem for the situation (MCT needs monotone; DCT needs a dominator; Fatou only gives an inequality)'
related:
  developed_in: ['a future math-measure-and-integration capsule']
sources:
  - 'folland_real_analysis'
  - 'billingsley_probability_measure'
status: reviewed
checks:
  type: validation/type-checks.md#fubini_tonelli
  specialization: validation/specialization-cases.md#fubini_tonelli
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#fubini_tonelli
