id: probability_space.complement_rule
node: complement_rule
status_label: mathematical_identity
display: 'P(A^c) = 1 - P(A); consequently P(A) in [0,1], P(empty) = 0, and A subset B implies P(A) <= P(B) (with P(B \ A) = P(B) - P(A)).'
parseable: 'P(A^c) = 1 - P(A) ;  A subset B => P(A) <= P(B)'
symbols:
  'A, B': 'events, type: element of F'
type_check_status: well_formed
type_check_note: 'A and A^c are disjoint with union Omega, so P(A) + P(A^c) = P(Omega) = 1 by finite additivity and normalization.'
hypotheses: []
preconditions: []
dependencies:
  - 'finite_additivity'
  - 'kolmogorov_axioms'
proof:
  technique: 'finite additivity on {A, A^c} plus P(Omega) = 1; monotonicity from B = A cup (B \ A) disjoint'
  derives_from: 'finite_additivity'
  lean_status: core
  lean_ref: 'validation/proof-checks.lean Prob.union_bound / incl_excl_2'
uses_choice: false
constructive: true
specialization_cases:
  - 'A = Omega: P(empty) = 0'
  - 'A = B: P(B \ B) = 0'
counterexamples_when_dropped:
  P_a_probability_measure: 'for a general (unnormalized) measure there is no ''1 -'' form; only mu(B \ A) = mu(B) - mu(A) with mu(A) < inf survives'
common_misuse:
  - 'writing P(A^c) = 1 - P(A) when conditioning: P(A^c | C) = 1 - P(A | C) is fine, but mixing conditioning events is not'
  - 'subtracting P(A) - P(B) without A superset B'
related:
  derives_from: ['finite_additivity']
  used_by: ['conditional_probability', 'borel_cantelli_second']
sources:
  - 'billingsley_probability_measure'
  - 'durrett_pte'
status: reviewed
checks:
  type: validation/type-checks.md#complement_rule
  specialization: validation/specialization-cases.md#complement_rule
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#complement_rule
