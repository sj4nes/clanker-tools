id: random_variable.pmf
node: pmf
status_label: definition
display: 'The probability mass function of a discrete X is p_X(x) = P(X = x). It satisfies p_X >= 0 and sum_{x in S} p_X(x) = 1, and P(X in B) = sum_{x in B} p_X(x).'
parseable: 'p_X(x) := P(X = x) ,  sum_x p_X(x) = 1'
symbols:
  'p_X': 'the pmf, type: S -> [0,1]'
  'S': 'the countable support, type: countable set'
type_check_status: well_formed
type_check_note: 'the pmf is the density of P_X with respect to counting measure on S; it determines the discrete law completely.'
hypotheses: []
preconditions: []
dependencies:
  - 'discrete_rv'
  - 'distribution_pushforward'
well_definedness: 'sum_{x in S} P(X = x) = P(X in S) = 1 by countable additivity over the disjoint singletons; nonnegativity is immediate.'
uses_choice: false
constructive: true
specialization_cases:
  - 'Bernoulli: p(1) = p, p(0) = 1 - p'
  - 'Poisson: p(k) = e^{-lambda} lambda^k / k!'
counterexamples_when_dropped:
  discreteness: 'for an absolutely continuous X, p_X(x) = P(X = x) = 0 everywhere -- the object that works is the pdf'
common_misuse:
  - 'reading p_X(x) as a probability density (it is an actual probability)'
  - 'forgetting the normalization when constructing a model'
related:
  analogue_of: ['pdf (counting vs Lebesgue reference measure)']
  used_by: ['lotus', 'expectation']
sources:
  - 'billingsley_probability_measure'
  - 'durrett_pte'
status: reviewed
checks:
  type: validation/type-checks.md#pmf
  specialization: validation/specialization-cases.md#pmf
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#pmf
