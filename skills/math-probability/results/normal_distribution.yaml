id: distributions.normal_distribution
node: normal_distribution
status_label: definition
display: 'X ~ N(mu, sigma^2), sigma > 0: density f_X(x) = (1/(sigma sqrt(2 pi))) exp(-(x - mu)^2 / (2 sigma^2)). E[X] = mu, Var(X) = sigma^2, M_X(t) = exp(mu t + sigma^2 t^2 / 2), phi_X(t) = exp(i mu t - sigma^2 t^2 / 2).'
parseable: 'f_X(x) = exp(-(x-mu)^2/(2 sigma^2)) / (sigma sqrt(2 pi)) ;  E = mu ;  Var = sigma^2'
symbols:
  'X': 'a normal variable, type: Omega -> R'
  'mu': 'mean, type: real'
  'sigma^2': 'variance, type: positive real'
type_check_status: well_formed
type_check_note: 'parameterized by the VARIANCE sigma^2 (not sigma). The universal limit law (CLT), the maximum-entropy law for a given mean and variance, closed under affine maps and independent sums, and the only law where zero correlation implies independence (jointly).'
hypotheses: []
preconditions: []
dependencies:
  - 'abstract_integral'
  - 'expectation'
  - 'pdf'
  - 'variance'
proof:
  technique: 'normalization by the Gaussian integral integral e^{-x^2/2} dx = sqrt(2 pi); MGF by completing the square; E = mu, Var = sigma^2 from M''''(0)'
  derives_from: 'abstract_integral'
  lean_status: core
  lean_ref: 'validation/instance-checks.bc -- standard normal pdf integrates to 1, second moment 1'
uses_choice: false
constructive: true
specialization_cases:
  - 'mu = 0, sigma = 1: standard normal Z; X = mu + sigma Z'
  - 'sum of independent normals is normal (variances add); the sample mean of iid normals is exactly normal'
  - '68-95-99.7 within 1-2-3 sigma; tail P(Z > z) approx phi(z)/z'
counterexamples_when_dropped:
  light_tails: 'financial returns, network delays, and many natural quantities have heavier-than-Gaussian tails -- assuming normality drastically underestimates extreme-event probabilities (a 5-sigma event is ~1 in 3.5 million under normality, far more common in reality)'
  the_CLT_does_not_make_everything_normal: 'the CLT needs iid-ish summands with finite variance; a single dominant term, heavy tails, or strong dependence breaks it'
common_misuse:
  - 'assuming normality for skewed or heavy-tailed data'
  - 'using sigma where sigma^2 is the parameter'
  - 'treating a large-sample CLT approximation as exact in the tails (Berry-Esseen: the error is O(1/sqrt n) and worst in the tails)'
applications:
  - 'thermal (Johnson-Nyquist) noise in every electronic receiver is Gaussian by the CLT -- the assumption that sets the design of all digital communication (Wi-Fi, LTE/5G, deep-space links) and the Shannon capacity formula'
  - 'measurement-error theory: Gauss derived the normal density (1809) as the error law making the arithmetic mean the maximum-likelihood estimate of a star''s position'
  - 'the Black-Scholes model assumes log-returns are Gaussian; its systematic failure in market crashes is exactly where the CLT''s finite-variance hypothesis breaks -- a textbook case of the capsule''s cauchy_no_mean warning'
  - 'the diffusion limit: a rescaled random walk converges to Brownian motion (Donsker''s theorem), the bridge to the heat equation, population genetics, and the Black-Scholes PDE'
related:
  standardizes_to: ['standard_normal']
  closed_under: ['normal_affine_closure']
  limit_in: ['central_limit_theorem']
sources:
  - 'billingsley_probability_measure'
  - 'durrett_pte'
status: reviewed
checks:
  type: validation/type-checks.md#normal_distribution
  specialization: validation/specialization-cases.md#normal_distribution
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#normal_distribution
