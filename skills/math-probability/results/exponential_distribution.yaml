id: distributions.exponential_distribution
node: exponential_distribution
status_label: definition
display: 'X ~ Exponential(lambda), lambda > 0: density f_X(x) = lambda e^{-lambda x} for x >= 0. E[X] = 1/lambda, Var(X) = 1/lambda^2, M_X(t) = lambda/(lambda - t) for t < lambda. Memoryless.'
parseable: 'f_X(x) = lambda e^{-lambda x}, x >= 0 ;  E = 1/lambda ;  Var = 1/lambda^2'
symbols:
  'X': 'an exponential variable, type: Omega -> [0, inf)'
  'lambda': 'the rate, type: positive real'
type_check_status: well_formed
type_check_note: 'the unique memoryless distribution on [0, inf): P(X > s + t | X > s) = P(X > t). The waiting time between events of a rate-lambda Poisson process; the continuous analogue of the geometric.'
hypotheses: []
preconditions: []
dependencies:
  - 'expectation'
  - 'memorylessness'
  - 'mgf'
  - 'pdf'
  - 'variance'
proof:
  technique: 'normalization integral_0^inf lambda e^{-lambda x} dx = 1; E[X] = integral x lambda e^{-lambda x} dx = 1/lambda by parts; memorylessness from P(X > t) = e^{-lambda t}'
  derives_from: 'pdf'
  lean_status: core
  lean_ref: 'validation/instance-checks.bc -- Exponential(0.5): E=2, Var=4, memoryless check'
uses_choice: false
constructive: true
specialization_cases:
  - 'lambda = 1: standard exponential; -log(U) for U ~ Uniform(0,1)'
  - 'min of independent Exponentials(lambda_i) ~ Exponential(sum lambda_i) -- competing risks'
  - 'sum of k iid Exponential(lambda) ~ Gamma(k, 1/lambda)'
counterexamples_when_dropped:
  memorylessness: 'the Weibull, gamma (shape != 1), and lognormal are NOT memoryless -- using an exponential for aging components (increasing hazard) underestimates late failures'
  constant_hazard_rate: 'f_X(x)/P(X > x) = lambda is constant; real lifetimes usually have a bathtub or increasing hazard'
common_misuse:
  - 'modeling component lifetimes with wear-out as exponential'
  - 'confusing the rate lambda with the mean 1/lambda'
related:
  discrete_analogue: ['geometric_distribution']
  characterized_by: ['memorylessness']
  sum_gives: ['gamma_distribution']
sources:
  - 'grimmett_stirzaker'
  - 'durrett_pte'
status: reviewed
checks:
  type: validation/type-checks.md#exponential_distribution
  specialization: validation/specialization-cases.md#exponential_distribution
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#exponential_distribution
