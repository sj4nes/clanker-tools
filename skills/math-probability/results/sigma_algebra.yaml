id: measure.sigma_algebra
node: sigma_algebra
status_label: definition
display: 'A family F of subsets of Omega is a sigma-algebra if Omega in F, F is closed under complement, and F is closed under countable unions (hence countable intersections).'
parseable: 'Omega in F ; A in F => A^c in F ; A_1,A_2,... in F => bigcup_n A_n in F'
symbols:
  'Omega': 'the sample space, type: set'
  'F': 'the family of events, type: subset of 2^Omega'
type_check_status: well_formed
type_check_note: 'closure is under COUNTABLE unions, not arbitrary; the three axioms give closure under countable intersection and set difference. The pair (Omega, F) is a measurable space.'
hypotheses: []
preconditions: []
dependencies:
  - 'countable_set'
  - 'set_algebra'
well_definedness: '{empty, Omega} is a sigma-algebra and 2^Omega is a sigma-algebra, so the notion is non-vacuous; an arbitrary intersection of sigma-algebras is a sigma-algebra, which is what makes sigma(C) well-defined.'
uses_choice: false
constructive: true
specialization_cases:
  - 'Omega countable: F = 2^Omega is the usual choice'
  - 'Omega = R: F = B(R), strictly smaller than 2^R (non-measurable sets exist under AC)'
counterexamples_when_dropped:
  countable_union_closure: 'the family of finite-or-cofinite subsets of N is closed under complement and FINITE unions but not countable ones -- it is an algebra, not a sigma-algebra'
common_misuse:
  - 'assuming closure under arbitrary unions'
  - 'treating every subset of an uncountable Omega as an event'
applications:
  - 'stochastic calculus: the filtration (F_t) is an increasing family of sigma-algebras modelling information over time -- the object Ito integration and the Black-Scholes derivation are built on (Karatzas-Shreve 1991)'
  - 'the reason a probability model on [0,1] cannot use every subset: the Vitali / Banach-Tarski constructions force F = B(R), and every rigorous statement about a continuous random variable is implicitly relative to it'
related:
  generalizes: ['algebra of sets (finite closure only)']
  special_case_of: ['Dynkin lambda-system + closure under intersection']
sources:
  - 'billingsley_probability_measure'
  - 'folland_real_analysis'
status: reviewed
checks:
  type: validation/type-checks.md#sigma_algebra
  specialization: validation/specialization-cases.md#sigma_algebra
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#sigma_algebra
