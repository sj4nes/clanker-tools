id: random_variable.joint_distribution
node: joint_distribution
status_label: definition
display: 'The joint distribution of X_1, ..., X_n is the law of the random vector X = (X_1, ..., X_n) on (R^n, B(R^n)): P_X(B) = P((X_1,...,X_n) in B). Described by the joint CDF, or a joint pmf / pdf.'
parseable: 'P_X(B) = P((X_1,...,X_n) in B) ,  a probability measure on B(R^n)'
symbols:
  'X': 'the random vector, type: Omega -> R^n'
  'P_X': 'the joint law, type: probability measure on B(R^n)'
type_check_status: well_formed
type_check_note: 'the joint law carries strictly more information than the collection of marginal laws -- it also encodes the dependence structure (correlation, copula). Rectangles B_1 x ... x B_n form a pi-system generating B(R^n), so the joint CDF determines it.'
hypotheses: []
preconditions: []
dependencies:
  - 'borel_sigma_algebra'
  - 'distribution_pushforward'
  - 'random_variable'
well_definedness: '(X_1,...,X_n) is measurable iff each X_i is (B(R^n) is generated by the coordinate projections); the pushforward is a probability measure on B(R^n).'
uses_choice: false
constructive: true
specialization_cases:
  - 'independent components: P_X = P_{X_1} tensor ... tensor P_{X_n}, joint density factorizes'
  - 'X_2 = X_1: the joint law is concentrated on the diagonal { x_1 = x_2 }, a lambda_2-null set (no joint density)'
counterexamples_when_dropped:
  none_the_marginals_do_not_determine_it: '(X,Y) and (X, X) can have the same marginals (both standard normal) but wildly different joint laws -- Cov 0 vs Cov 1'
common_misuse:
  - 'reconstructing the joint law from marginals (impossible without a dependence assumption)'
  - 'assuming a joint density exists (it does not when components are functionally related)'
related:
  projects_to: ['marginal_distribution']
  used_by: ['independence_random_variables', 'conditional_distribution', 'covariance']
sources:
  - 'billingsley_probability_measure'
  - 'durrett_pte'
status: reviewed
checks:
  type: validation/type-checks.md#joint_distribution
  specialization: validation/specialization-cases.md#joint_distribution
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#joint_distribution
