id: measure.generated_sigma_algebra
node: generated_sigma_algebra
status_label: constructive_result
display: 'For any collection C of subsets of Omega, sigma(C) is the smallest sigma-algebra containing C -- the intersection of all sigma-algebras that contain C.'
parseable: 'sigma(C) = bigcap { G : G a sigma-algebra, C subset G }'
symbols:
  'C': 'a collection of subsets, type: subset of 2^Omega'
  'sigma(C)': 'the generated sigma-algebra, type: sigma-algebra'
type_check_status: well_formed
type_check_note: 'the intersection is over a nonempty family (2^Omega always qualifies), so sigma(C) exists and is itself a sigma-algebra; it is the unique smallest one.'
hypotheses: []
preconditions: []
dependencies:
  - 'set_algebra'
  - 'sigma_algebra'
proof:
  technique: 'intersect all sigma-algebras containing C; verify the intersection is a sigma-algebra and is contained in every other such -- hence smallest'
  derives_from: 'sigma_algebra'
  lean_status: cited
  lean_ref: null
well_definedness: 'an arbitrary intersection of sigma-algebras on Omega is a sigma-algebra (each axiom is preserved under intersection); 2^Omega contains C, so the family intersected is nonempty.'
uses_choice: false
constructive: true
specialization_cases:
  - 'C = { (-inf, x] : x in Q }: sigma(C) = B(R)'
  - 'C = a single set A: sigma(C) = { empty, A, A^c, Omega }'
counterexamples_when_dropped:
  none_all_hypotheses_essential: 'every listed hypothesis is used in the proof; see the block above'
common_misuse:
  - 'trying to describe sigma(C)''s members explicitly -- usually impossible; work via the pi-lambda theorem instead'
  - 'confusing ''generated by'' with ''the algebra generated by'' (finite operations)'
related:
  used_by: ['borel_sigma_algebra', 'independence_sigma_algebras']
sources:
  - 'billingsley_probability_measure'
  - 'folland_real_analysis'
status: reviewed
checks:
  type: validation/type-checks.md#generated_sigma_algebra
  specialization: validation/specialization-cases.md#generated_sigma_algebra
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#generated_sigma_algebra
