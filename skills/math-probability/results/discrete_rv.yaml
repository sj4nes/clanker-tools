id: random_variable.discrete_rv
node: discrete_rv
status_label: definition
display: 'X is discrete if it takes values in a countable set S (its support); equivalently P(X in S) = 1 for some countable S.'
parseable: 'exists countable S subset R with P(X in S) = 1'
symbols:
  'X': 'a random variable, type: Omega -> R'
  'S': 'the countable support, type: countable subset of R'
type_check_status: well_formed
type_check_note: 'the law is then a countable sum of point masses P_X = sum_{x in S} p_X(x) delta_x, entirely described by the pmf.'
hypotheses: []
preconditions: []
dependencies:
  - 'countable_set'
  - 'random_variable'
well_definedness: 'a countable S with P(X in S) = 1 makes P_X purely atomic; the smallest such S is { x : P(X = x) > 0 }.'
uses_choice: false
constructive: true
specialization_cases:
  - 'S finite: a simple random variable, a finite sum of indicators'
  - 'S = N: e.g. Poisson, geometric'
counterexamples_when_dropped:
  countability_of_S: 'if the smallest such S is uncountable then no pmf exists -- e.g. any absolutely continuous X has P(X = x) = 0 for every x'
common_misuse:
  - 'assuming every random variable is discrete or continuous (mixed and singular laws exist)'
related:
  used_by: ['pmf', 'conditional_expectation_elementary']
  complement_of: ['absolutely_continuous_rv']
sources:
  - 'billingsley_probability_measure'
  - 'durrett_pte'
status: reviewed
checks:
  type: validation/type-checks.md#discrete_rv
  specialization: validation/specialization-cases.md#discrete_rv
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#discrete_rv
