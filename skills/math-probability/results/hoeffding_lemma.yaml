id: inequalities.hoeffding_lemma
node: hoeffding_lemma
status_label: proved_lemma
display: 'If X is a random variable with a <= X <= b a.s. and E[X] = 0, then M_X(t) = E[e^{tX}] <= exp(t^2 (b - a)^2 / 8) for all real t. (X is sub-Gaussian with parameter (b-a)/2.)'
parseable: 'a <= X <= b a.s., E[X] = 0  =>  E[e^{tX}] <= exp(t^2 (b - a)^2 / 8)'
symbols:
  'X': 'a bounded centered random variable, type: Omega -> [a, b]'
  't': 'a real parameter, type: real'
type_check_status: well_formed
type_check_note: 'by convexity of x |-> e^{tx} on [a, b], e^{tX} <= (b - X)/(b - a) e^{ta} + (X - a)/(b - a) e^{tb}; take expectations (E[X] = 0), define psi(t) = log of the result, and show psi''''(t) <= (b - a)^2 / 4 by a variance argument, so psi(t) <= t^2 (b-a)^2 / 8.'
hypotheses: []
preconditions: []
dependencies:
  - 'convex_function'
  - 'expectation'
  - 'jensen_inequality'
  - 'mgf'
proof:
  technique: 'convex bound of e^{tx} by its chord on [a,b]; take E; the log of the bound has second derivative <= (b-a)^2/4 (it is the variance of a tilted [a,b]-valued law); integrate twice from psi(0) = psi''(0) = 0'
  derives_from: 'convex_function'
  lean_status: cited
  lean_ref: 'Hoeffding 1963 Lemma; Boucheron-Lugosi-Massart Lemma 2.2'
uses_choice: false
constructive: true
specialization_cases:
  - 'X ~ Uniform{-c, c} (or any symmetric law on [-c, c]): recovers the sub-Gaussian bound e^{c^2 t^2 / 2}'
  - 'the (b - a)^2 / 8 constant is sharp for the two-point law at a, b with mean 0'
counterexamples_when_dropped:
  boundedness: 'an unbounded centered X (e.g. centered exponential) is not sub-Gaussian -- its MGF grows faster than any e^{ct^2}, only e^{c|t|} for small t (sub-exponential); Hoeffding''s inequality is replaced by Bernstein''s'
  E_X_eq_0: 'without centering, M_X(t) has an extra e^{t E[X]} factor -- the lemma is stated for the centered variable'
common_misuse:
  - 'applying it to unbounded variables'
  - 'forgetting to center first'
related:
  requires: ['convex_function', 'mgf']
  used_by: ['hoeffding_inequality']
  generalizes_to: ['sub-Gaussian / Bernstein / sub-exponential concentration']
sources:
  - 'boucheron_lugosi_massart'
  - 'durrett_pte'
status: reviewed
checks:
  type: validation/type-checks.md#hoeffding_lemma
  specialization: validation/specialization-cases.md#hoeffding_lemma
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#hoeffding_lemma
