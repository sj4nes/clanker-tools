id: distributions.bernoulli_distribution
node: bernoulli_distribution
status_label: definition
display: 'X ~ Bernoulli(p), p in [0,1]: P(X = 1) = p, P(X = 0) = 1 - p. E[X] = p, Var(X) = p(1-p), M_X(t) = 1 - p + p e^t. The indicator of a probability-p event.'
parseable: 'P(X=1) = p, P(X=0) = 1-p ;  E = p ;  Var = p(1-p)'
symbols:
  'X': 'a Bernoulli variable, type: Omega -> {0,1}'
  'p': 'success probability, type: real in [0,1]'
type_check_status: well_formed
type_check_note: 'the building block: any event A gives 1_A ~ Bernoulli(P(A)). E[X] = E[X^2] = p (since X^2 = X), so Var = p - p^2.'
hypotheses: []
preconditions: []
dependencies:
  - 'expectation'
  - 'indicator_rv'
  - 'mgf'
  - 'pmf'
  - 'variance'
well_definedness: 'a two-point law with masses p and 1 - p summing to 1; well-defined for every p in [0,1].'
uses_choice: false
constructive: true
specialization_cases:
  - 'p = 1/2: the fair coin, maximum variance 1/4'
  - 'p in {0,1}: degenerate (constant), variance 0'
  - 'sum of n iid Bernoulli(p) = Binomial(n, p)'
counterexamples_when_dropped:
  p_in_0_1: 'p outside [0,1] is not a probability'
common_misuse:
  - 'confusing the parameter p with the outcome'
  - 'forgetting Var is maximized at p = 1/2, not p = 1'
related:
  generalizes_to: ['binomial_distribution']
  is: ['an indicator random variable (indicator_rv)']
sources:
  - 'grimmett_stirzaker'
  - 'durrett_pte'
status: reviewed
checks:
  type: validation/type-checks.md#bernoulli_distribution
  specialization: validation/specialization-cases.md#bernoulli_distribution
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#bernoulli_distribution
