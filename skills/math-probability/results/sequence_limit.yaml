id: analysis.sequence_limit
node: sequence_limit
status_label: definition
display: 'Convergence of a real sequence in the epsilon-N sense, with uniqueness of limits, the algebra of limits, the squeeze theorem, and monotone convergence.'
parseable: 'x_n -> L :  for all eps>0 exists N, for all n>=N, |x_n - L| < eps'
symbols:
  '(x_n)': 'a real sequence, type: N -> R'
  'L': 'the limit, type: real'
type_check_status: well_formed
type_check_note: 'the quantifier order is ''for all eps EXISTS N'' (N may depend on eps); the uniform form (''exists N for all eps'') is a different, stronger statement -- relevant to the difference between the convergence modes downstream. Discharged from math-real-analysis.'
hypotheses: []
preconditions: []
dependencies: []
well_definedness: 'limits are unique (a Hausdorff fact for R); the algebra of limits (sum, product, quotient with nonzero denominator) is standard.'
uses_choice: false
constructive: true
specialization_cases:
  - 'P(A_n) -> P(A) statements (continuity of probability) are sequence limits in [0,1]'
  - 'convergence of a series is convergence of its partial-sum sequence'
counterexamples_when_dropped:
  none_all_hypotheses_essential: 'every listed hypothesis is used in the proof; see the block above'
common_misuse:
  - 'swapping the eps and N quantifiers (that is uniform convergence)'
  - 'assuming a bounded sequence converges (it has a convergent SUBSEQUENCE -- Bolzano-Weierstrass)'
related:
  developed_in: ['math-real-analysis']
sources:
  - 'rudin_principles'
  - 'tao_analysis_I'
status: reviewed
checks:
  type: validation/type-checks.md#sequence_limit
  specialization: validation/specialization-cases.md#sequence_limit
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#sequence_limit
