id: logic.set_algebra
node: set_algebra
status_label: definition
display: 'The Boolean algebra of subsets of a fixed set: union, intersection, complement, difference, De Morgan''s laws, and arbitrary (indexed) unions and intersections.'
parseable: 'A cup B, A cap B, A^c, bigcup_i A_i, bigcap_i A_i ; De Morgan ; distributivity'
symbols:
  'A, B': 'subsets of a set Omega, type: element of 2^Omega'
  '{A_i}': 'an indexed family, type: I -> 2^Omega'
type_check_status: well_formed
type_check_note: 'operations are on subsets of one fixed Omega; an indexed intersection needs I nonempty for the usual identities. Discharged from math-sets-functions-cardinality.'
hypotheses: []
preconditions: []
dependencies: []
well_definedness: 'the powerset 2^Omega is a complete Boolean algebra under subset-or-equal; every identity used downstream (De Morgan, distributivity, A = (A cap B) cup (A cap B^c)) holds there.'
uses_choice: false
constructive: true
specialization_cases:
  - 'two sets: A cup A^c = Omega, A cap A^c = empty'
  - 'indexed: (bigcup_i A_i)^c = bigcap_i A_i^c (De Morgan, arbitrary)'
counterexamples_when_dropped:
  none_all_hypotheses_essential: 'every listed hypothesis is used in the proof; see the block above'
common_misuse:
  - 'intersecting an empty family (gives Omega, not empty)'
  - 'assuming a sigma-algebra is closed under ARBITRARY unions -- only countable'
related:
  developed_in: ['math-sets-functions-cardinality']
sources:
  - 'enderton_set_theory'
  - 'halmos_naive_set_theory'
status: reviewed
checks:
  type: validation/type-checks.md#set_algebra
  specialization: validation/specialization-cases.md#set_algebra
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#set_algebra
