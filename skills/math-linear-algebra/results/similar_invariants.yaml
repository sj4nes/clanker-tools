id: eigentheory.similar_invariants
node: similar_invariants
status_label: proposition
display: 'Similar matrices share rank, trace, determinant, characteristic polynomial, minimal polynomial, and every eigenvalue multiplicity. NONE of these, nor all together short of the Jordan data, is a COMPLETE invariant.'
parseable: 'A ~ B  =>  rank, tr, det, p, m, and all multiplicities agree;  the converse FAILS'
field_scope: any_field
choice_grade: choice_free
symbols:
  '~': 'similarity'
type_check_status: well_formed
type_check_note: 'Well-formed. The proposition is a list of necessary conditions; its value is as much in the failure of sufficiency as in the invariances.'
hypotheses:
  - 'A ~ B'
preconditions: []
dependencies:
  - 'characteristic_polynomial'
  - 'determinant_similarity_invariant'
  - 'matrix_rank'
  - 'minimal_polynomial'
  - 'non_diagonalisable_counterexample'
  - 'rank_inequalities'
  - 'similarity'
  - 'trace_cyclic'
proof:
  technique: 'rank because multiplication by invertibles preserves it (rank_inequalities); trace by trace_cyclic; determinant and characteristic polynomial by determinant_similarity_invariant; minimal polynomial because p(P^{-1}AP) = P^{-1}p(A)P'
  derives_from: 'similarity'
  lean_status: instance
  lean_ref: 'LinAlg.charpoly_not_complete_invariant'
uses_choice: false
constructive: true
specialization_cases:
  - 'A diagonalisable: the eigenvalue multiset IS complete among diagonalisable matrices'
  - 'p and m together are complete for n <= 3, but not for n >= 4'
counterexamples_when_dropped:
  completeness_fails_for_p_alone: 'I_2 and [[1,1],[0,1]] share p(t) = (t-1)^2 and are not similar (they have different ranks of A - I)'
  completeness_fails_for_p_and_m_together_at_n_equals_4: 'diag(J_2(0), J_2(0)) and diag(J_2(0), 0, 0) both have p = t^4 and m = t^2, yet have different numbers of blocks (2 versus 3) and hence different ranks -- they are not similar. This is the standard witness that p and m do not suffice'
  these_are_not_congruence_invariants: 'trace and determinant are NOT preserved by congruence; only the inertia is (sylvester_law_of_inertia)'
common_misuse:
  - 'concluding similarity from equal characteristic polynomials'
  - 'using these invariants to compare matrices related by congruence rather than similarity'
related:
  contrasts_with: ['congruence']
sources:
  - 'horn_johnson_2e'
status: reviewed
checks:
  type: validation/type-checks.md#similar_invariants
  specialization: validation/specialization-cases.md#similar_invariants
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#similar_invariants
