id: inner_product.polarisation_identity
node: polarisation_identity
status_label: mathematical_identity
display: 'Over R: <u,v> = (||u+v||^2 - ||u-v||^2)/4. Over C: <u,v> = (1/4) sum_{k=0}^3 i^k ||u + i^k v||^2. The inner product is RECOVERABLE from the norm; the factor 1/4 is why characteristic 2 is excluded.'
parseable: 'R: <u,v> = (||u+v||^2 - ||u-v||^2)/4;  C: <u,v> = (1/4) sum_{k=0}^3 i^k ||u + i^k v||^2'
field_scope: char_not_2
choice_grade: choice_free
symbols:
  'i^k': 'the four fourth roots of unity, k = 0,1,2,3'
type_check_status: well_formed
type_check_note: 'Well-formed over R and C. The division by 4 requires 2 to be invertible -- hence the characteristic_not_two edge. Over a field of characteristic 2 no polarisation exists and symmetric bilinear forms are not determined by their quadratic forms.'
hypotheses:
  - 'char F != 2'
  - 'F = R or C'
preconditions: []
dependencies:
  - 'characteristic_not_two'
  - 'induced_norm'
  - 'inner_product'
  - 'parallelogram_law'
proof:
  technique: 'expand each squared norm and collect; over C the four terms isolate the real and imaginary parts of <u,v> separately'
  derives_from: 'parallelogram_law'
  lean_status: dim_core
  lean_ref: 'LinAlg.polarisation_real (n = 2, stated as 4*<u,v> = ... so the char != 2 dependence is explicit)'
uses_choice: false
constructive: true
specialization_cases:
  - 'u = v over R: (||2u||^2 - 0)/4 = ||u||^2, correct'
  - 'the real formula applied to a COMPLEX inner product recovers only Re<u,v>, which is why the complex version needs four terms'
counterexamples_when_dropped:
  characteristic_not_two: 'over F_2 the map q(x) = x^T A x satisfies q(u+v) = q(u) + q(v) (all cross terms double to zero), so q is ADDITIVE and carries none of the bilinear information. Symmetric and alternating forms become indistinguishable -- the single sharpest consequence of char 2 in this capsule'
  using_the_real_formula_over_C: 'gives Re<u,v> only, losing the imaginary part entirely'
common_misuse:
  - 'applying the real polarisation formula in a complex space'
  - 'symmetrising a matrix as (A + A^T)/2 over a field of characteristic 2'
related:
  required_by: ['isometry_characterisation', 'quadratic_form']
sources:
  - 'axler_lada_4e'
status: reviewed
checks:
  type: validation/type-checks.md#polarisation_identity
  specialization: validation/specialization-cases.md#polarisation_identity
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#polarisation_identity
