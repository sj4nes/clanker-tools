id: linear_maps.dual_map
node: dual_map
status_label: definition
display: 'For T: V -> W the dual (transpose) map T^t: W^* -> V^* is T^t(g) = g o T. It REVERSES direction, and (ST)^t = T^t S^t.'
parseable: 'T^t : W^* -> V^*,  T^t(g) := g o T;  (S o T)^t = T^t o S^t'
field_scope: any_field
choice_grade: choice_free
symbols:
  'T^t': 'the dual map, type: linear map W^* -> V^*'
  'g': 'a functional on W, type: element of W^*'
type_check_status: well_formed
type_check_note: 'Well-formed: g o T is a composite of linear maps V -> W -> F, hence an element of V^*. The direction reversal is forced by the types, and it is the abstract reason (AB)^T = B^T A^T.'
hypotheses:
  - 'T linear'
preconditions: []
dependencies:
  - 'composition_of_linear_maps'
  - 'dual_space'
proof:
  technique: 'linearity of T^t from bilinearity of composition; the contravariance from associativity'
  derives_from: 'composition_of_linear_maps'
  lean_status: cited
  lean_ref: null
uses_choice: false
constructive: true
specialization_cases:
  - 'in dual bases, the matrix of T^t is the TRANSPOSE of the matrix of T -- the conceptual content of the transpose operation'
  - 'T = I: T^t = I'
counterexamples_when_dropped:
  none_all_hypotheses_essential: 'the definition needs only linearity; it is the MATRIX statement that needs finite-dimensionality and a choice of dual bases'
common_misuse:
  - 'expecting T^t: V^* -> W^*: the arrow reverses. Every ''why is it B^T A^T and not A^T B^T'' question is answered here'
  - 'confusing the dual map (no inner product needed) with the ADJOINT T^* (needs an inner product and conjugates over C) -- they agree over R under the Riesz identification only'
related:
  dual_of: ['transpose']
  contrasts_with: ['adjoint_operator']
sources:
  - 'hoffman_kunze_2e'
  - 'axler_lada_4e'
status: reviewed
checks:
  type: validation/type-checks.md#dual_map
  specialization: validation/specialization-cases.md#dual_map
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#dual_map
