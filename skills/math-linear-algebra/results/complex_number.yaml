id: foundations.complex_number
node: complex_number
status_label: proved_theorem
display: 'C = R[i] with i^2 = -1: a field of characteristic 0 carrying the conjugation a + bi -> a - bi, with |z|^2 = z conj(z) >= 0. Cited: NO capsule in this stack constructs C.'
parseable: 'C := R[t]/(t^2 + 1);  conj(a + bi) = a - bi;  |z|^2 = z conj(z)'
choice_grade: choice_free
symbols:
  'C': 'the complex field, type: field of characteristic 0'
  'conj(z)': 'complex conjugation, type: field automorphism C -> C fixing R'
  '|z|': 'modulus, type: function C -> R_{>=0}'
type_check_status: well_formed
type_check_note: 'Cited. Well-formed as a quotient of the polynomial ring R[t] by the maximal ideal (t^2 + 1); the quotient is a field because that polynomial is irreducible over R.'
