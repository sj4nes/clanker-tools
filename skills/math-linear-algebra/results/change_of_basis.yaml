id: matrices.change_of_basis
node: change_of_basis
status_label: proved_theorem
display: 'If P = [I]_{B<-B''} is the change-of-basis matrix then [v]_B = P[v]_{B''} and [T]_{B''} = P^{-1}[T]_B P. Matrices of the same operator in different bases are SIMILAR.'
parseable: '[v]_B = P [v]_{B''};  [T]_{B''} = P^{-1} [T]_B P,  P = [I]_{B<-B''}'
field_scope: any_field
choice_grade: choice_free
symbols:
  'P': 'the change-of-basis matrix, whose COLUMNS are the B-coordinates of the B''-basis vectors'
type_check_status: well_formed
type_check_note: 'Well-formed; P is invertible because I is. Note the direction: P''s columns express the NEW basis in the OLD one, and coordinates therefore transform by P, not P^{-1} -- the classic source of inverted transformations.'
hypotheses:
  - 'V finite-dimensional'
  - 'both bases ordered'
preconditions: []
dependencies:
  - 'coordinate_isomorphism'
  - 'invertible_matrix'
  - 'matrix_mult_is_composition'
  - 'matrix_of_linear_map'
  - 'ordered_basis'
proof:
  technique: 'apply matrix_mult_is_composition to T = I o T o I with the appropriate bases'
  derives_from: 'matrix_mult_is_composition'
  lean_status: cited
  lean_ref: null
uses_choice: false
constructive: true
specialization_cases:
  - 'B = B'': P = I and the formula is trivial'
  - 'T diagonalisable: some P makes [T]_{B''} diagonal, which IS diagonalisable'
counterexamples_when_dropped:
  invertibility_of_P: 'a non-basis ''B'''' gives a singular P and no conjugation formula'
  vectors_versus_operators: 'vectors transform by P and operator matrices by P^{-1}(.)P. Applying the vector rule to an operator (or vice versa) is the standard covariance/contravariance error'
common_misuse:
  - 'using P where P^{-1} is needed: fix the convention (columns of P are the new basis in old coordinates) and check on a 2x2 example every time'
related:
  required_by: ['similarity']
sources:
  - 'hoffman_kunze_2e'
status: reviewed
checks:
  type: validation/type-checks.md#change_of_basis
  specialization: validation/specialization-cases.md#change_of_basis
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#change_of_basis
