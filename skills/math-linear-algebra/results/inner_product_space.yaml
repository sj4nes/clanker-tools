id: inner_product.inner_product_space
node: inner_product_space
status_label: definition
display: 'A vector space over R or C together with a chosen inner product. Finite-dimensional real ones are Euclidean spaces; complete infinite-dimensional ones are Hilbert spaces (OUT OF SCOPE).'
parseable: '(V, <.,.>) with V an F-vector space, F in {R, C}, and <.,.> an inner product'
field_scope: real_or_complex
choice_grade: choice_free
symbols:
  '(V, <.,.>)': 'the structure; the inner product is DATA, not intrinsic to V'
type_check_status: well_formed
type_check_note: 'Well-formed. The inner product is extra structure: the same V carries many, and results about ''the'' orthogonal complement or ''the'' adjoint are relative to the chosen one.'
hypotheses:
  - 'F = R or C'
preconditions: []
dependencies:
  - 'inner_product'
  - 'vector_space'
uses_choice: false
constructive: true
specialization_cases:
  - 'R^n with the dot product: Euclidean n-space'
  - 'C^n with y^*x: unitary space'
  - 'F^{m x n} with <A,B> = tr(B^*A): the Frobenius inner product, which is what matrix_norms uses'
counterexamples_when_dropped:
  completeness_is_NOT_assumed: 'finite-dimensional inner product spaces are automatically complete; infinite-dimensional ones need not be, and every theorem here that uses orthogonal_decomposition fails for a non-closed subspace of an incomplete space. That is the Hilbert-space boundary this capsule does not cross'
common_misuse:
  - 'treating orthogonality as intrinsic to V: it depends entirely on the chosen inner product, and a change of inner product is a change of geometry'
related:
  required_by: ['cauchy_schwarz', 'orthogonality']
sources:
  - 'axler_lada_4e'
status: reviewed
checks:
  type: validation/type-checks.md#inner_product_space
  specialization: validation/specialization-cases.md#inner_product_space
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#inner_product_space
