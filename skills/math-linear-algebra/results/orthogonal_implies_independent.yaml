id: inner_product.orthogonal_implies_independent
node: orthogonal_implies_independent
status_label: proposition
display: 'An orthogonal set of NONZERO vectors is linearly independent. Hence any orthonormal set has at most dim V elements.'
parseable: '(v_i) pairwise orthogonal, all v_i != 0  =>  (v_i) independent'
field_scope: real_or_complex
choice_grade: choice_free
symbols:
  '(v_i)': 'an orthogonal family'
type_check_status: well_formed
type_check_note: 'Well-formed. The nonzero hypothesis is indispensable: 0 is orthogonal to everything.'
hypotheses:
  - 'pairwise orthogonal'
  - 'all vectors nonzero'
preconditions: []
dependencies:
  - 'induced_norm'
  - 'linear_independence'
  - 'orthogonality'
proof:
  technique: 'take <., v_j> of a vanishing combination: every term but the j-th dies, leaving a_j ||v_j||^2 = 0, and ||v_j|| != 0 forces a_j = 0'
  derives_from: 'linear_independence'
  lean_status: core
  lean_ref: 'LinAlg.orthogonal_indep_core'
uses_choice: false
constructive: true
specialization_cases:
  - 'an orthonormal set: automatically nonzero, hence independent'
  - 'n orthonormal vectors in an n-dimensional space therefore form a BASIS with no further argument'
counterexamples_when_dropped:
  nonzeroness: '{0, e_1} is orthogonal and dependent'
  positive_definiteness: 'the proof divides by ||v_j||^2; over a degenerate form a self-orthogonal nonzero vector makes this step fail, and over F_2 the set {(1,1)} is ''orthogonal'' to itself'
common_misuse:
  - 'asserting independence of an orthogonal set that contains 0'
related:
  required_by: ['orthonormal_basis']
sources:
  - 'axler_lada_4e'
status: reviewed
checks:
  type: validation/type-checks.md#orthogonal_implies_independent
  specialization: validation/specialization-cases.md#orthogonal_implies_independent
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#orthogonal_implies_independent
