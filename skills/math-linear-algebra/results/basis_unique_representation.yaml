id: vector_spaces.basis_unique_representation
node: basis_unique_representation
status_label: proposition
display: 'A family B is a basis of V if and only if every v in V has EXACTLY ONE representation as a finite linear combination of members of B.'
parseable: 'B basis  <=>  for all v in V there are unique finitely-supported (a_b) with v = sum_b a_b b'
field_scope: any_field
choice_grade: choice_free
symbols:
  '(a_b)': 'the coordinate family, type: finitely supported function B -> F'
type_check_status: well_formed
type_check_note: 'Well-formed. Existence of a representation is spanning; uniqueness is independence. The proposition is the bridge from the abstract definition to coordinates.'
hypotheses:
  - 'B a family in V'
preconditions: []
dependencies:
  - 'basis'
  - 'linear_independence'
proof:
  technique: 'existence <=> spanning by definition; uniqueness <=> independence, since two representations of v differ by a vanishing combination'
  derives_from: 'linear_independence'
  lean_status: cited
  lean_ref: null
uses_choice: false
constructive: true
specialization_cases:
  - 'B the standard basis of F^n: the coordinates are the components themselves'
counterexamples_when_dropped:
  independence: 'with a dependent spanning family, 0 has more than one representation and coordinates are not functions'
  spanning: 'with an independent non-spanning family, some v has no representation at all'
common_misuse:
  - 'assuming coordinates are basis-independent: they are defined only relative to a FIXED ORDERED basis, and change_of_basis is the whole theory of what happens otherwise'
related:
  required_by: ['ordered_basis', 'direct_sum']
sources:
  - 'axler_lada_4e'
status: reviewed
checks:
  type: validation/type-checks.md#basis_unique_representation
  specialization: validation/specialization-cases.md#basis_unique_representation
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#basis_unique_representation
