id: vector_spaces.subspace_intersection
node: subspace_intersection
status_label: proposition
display: 'An arbitrary intersection of subspaces of V is a subspace. A UNION of two subspaces is a subspace if and only if one contains the other.'
parseable: 'U_i subspaces => intersection of U_i is a subspace;  U union W subspace <=> (U subset W or W subset U)'
field_scope: any_field
choice_grade: choice_free
symbols:
  '(U_i)_{i in I}': 'an arbitrary family of subspaces, I possibly infinite'
type_check_status: well_formed
type_check_note: 'Well-formed for an arbitrary index set: the intersection of the empty family is V by convention, which is a subspace. The union clause is an iff, so it also records when the union IS a subspace.'
hypotheses:
  - 'each U_i a subspace of V'
preconditions: []
dependencies:
  - 'subspace'
proof:
  technique: 'intersection: each closure is checked coordinatewise across the family. Union: if neither contains the other pick u in U\W and w in W\U; then u + w lies in neither'
  derives_from: 'subspace_criterion'
  lean_status: cited
  lean_ref: null
uses_choice: false
constructive: true
specialization_cases:
  - 'two distinct lines through the origin in R^2 intersect in {0}, a subspace, but their union is not'
  - 'the intersection of all subspaces containing S is span(S) -- this is span_is_smallest_subspace'
counterexamples_when_dropped:
  intersection_rather_than_union: 'the x-axis and y-axis in R^2 are subspaces; their union contains (1,0) and (0,1) but not (1,1)'
common_misuse:
  - 'forming ''the subspace generated by U and W'' as the union -- it is the SUM U + W (sum_of_subspaces)'
related:
  required_by: ['span_is_smallest_subspace', 'direct_sum']
sources:
  - 'axler_lada_4e'
status: reviewed
checks:
  type: validation/type-checks.md#subspace_intersection
  specialization: validation/specialization-cases.md#subspace_intersection
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#subspace_intersection
