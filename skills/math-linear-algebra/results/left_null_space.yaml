id: matrices.left_null_space
node: left_null_space
status_label: definition
display: 'The left null space of A is null(A^T) = {y in F^m : A^T y = 0} = {y : y^T A = 0}, a subspace of F^m of dimension m - rank A.'
parseable: 'null(A^T) = {y in F^m : y^T A = 0};  dim = m - rank A'
field_scope: any_field
choice_grade: choice_free
symbols:
  'y': 'a left null vector, type: element of F^m'
type_check_status: well_formed
type_check_note: 'Well-formed. The two descriptions agree because y^T A = 0 (a row identity) transposes to A^T y = 0.'
hypotheses: []
preconditions: []
dependencies:
  - 'null_space'
  - 'transpose'
uses_choice: false
constructive: true
specialization_cases:
  - 'A of full row rank: the left null space is {0}, and Ax = b is solvable for EVERY b'
  - 'each left null vector y gives a consistency condition y^T b = 0 on b for Ax = b to be solvable'
counterexamples_when_dropped:
  none_all_hypotheses_essential: 'a definition'
common_misuse:
  - 'ignoring it when diagnosing an inconsistent system: inconsistency is exactly the existence of a y in null(A^T) with y^T b != 0'
