id: vector_spaces.ordered_basis
node: ordered_basis
status_label: definition
display: 'An ordered basis B = (b_1,...,b_n) of an n-dimensional V determines the coordinate map [.]_B : V -> F^n sending v to the column of its unique coefficients. It is a linear bijection.'
parseable: '[v]_B := (a_1,...,a_n)^T where v = sum_i a_i b_i;  [.]_B : V -> F^n linear and bijective'
field_scope: any_field
choice_grade: choice_free
symbols:
  '[v]_B': 'the coordinate column of v, type: element of F^n'
  'B': 'an ORDERED basis, type: finite sequence, not a set'
type_check_status: well_formed
type_check_note: 'Well-formed by basis_unique_representation (coordinates exist and are unique) plus the index_convention (they are assembled as a COLUMN). Ordering is essential: permuting B permutes the coordinates.'
hypotheses:
  - 'V finite-dimensional'
  - 'B an ordered basis'
preconditions: []
dependencies:
  - 'basis'
  - 'basis_unique_representation'
  - 'dimension'
uses_choice: false
constructive: true
specialization_cases:
  - 'V = F^n with the standard ordered basis: [v]_B = v, the identity'
  - 'V = polynomials of degree <= 2 with B = (1, t, t^2): [3 + 5t^2]_B = (3, 0, 5)^T'
counterexamples_when_dropped:
  orderedness: 'an unordered basis gives coordinates only up to permutation, so no well-defined map to F^n and no well-defined matrix of a linear map'
common_misuse:
  - 'writing [v] without recording which basis -- almost every sign and transposition error in applied linear algebra is a dropped basis label'
related:
  required_by: ['coordinate_isomorphism', 'matrix_of_linear_map']
sources:
  - 'hoffman_kunze_2e'
status: reviewed
checks:
  type: validation/type-checks.md#ordered_basis
  specialization: validation/specialization-cases.md#ordered_basis
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#ordered_basis
