id: inner_product.orthonormal_basis
node: orthonormal_basis
status_label: definition
display: 'An orthonormal basis is a basis that is an orthonormal set. Relative to one, coordinates are simply <v, e_i>: no matrix inversion, and the change-of-basis matrix is UNITARY.'
parseable: '(e_i) orthonormal and a basis;  v = sum_i <v, e_i> e_i;  [v]_E computed by inner products'
field_scope: real_or_complex
choice_grade: choice_free
symbols:
  'e_i': 'the orthonormal basis vectors'
  '<v,e_i>': 'the i-th Fourier coefficient'
type_check_status: well_formed
type_check_note: 'Well-formed. The coordinate formula is the payoff: for a general basis, coordinates require solving a linear system; for an orthonormal one they are n inner products.'
hypotheses:
  - 'V an inner product space'
preconditions: []
dependencies:
  - 'basis'
  - 'induced_norm'
  - 'orthogonal_implies_independent'
  - 'orthogonality'
uses_choice: false
constructive: true
specialization_cases:
  - 'the standard basis of F^n'
  - 'existence in every finite-dimensional inner product space is gram_schmidt'
  - 'the Fourier basis on L^2[0,2pi]: the infinite-dimensional analogue, where ''basis'' means a convergent series, not a finite combination'
counterexamples_when_dropped:
  orthonormality: 'for a general basis, v = sum <v,b_i> b_i is FALSE -- the correct coefficients come from the inverse Gram matrix (gram_matrix), and the discrepancy is exactly the failure of orthogonality'
  finite_dimensionality: 'an orthonormal SET need not be a basis in infinite dimension even if maximal -- the algebraic and topological notions of basis diverge (see linear_combination)'
common_misuse:
  - 'using the coefficient formula <v, b_i> with a non-orthonormal basis -- the single most common error in applied projection work'
related:
  required_by: ['gram_schmidt', 'orthogonal_projection', 'parseval_identity', 'adjoint_operator']
sources:
  - 'axler_lada_4e'
status: reviewed
checks:
  type: validation/type-checks.md#orthonormal_basis
  specialization: validation/specialization-cases.md#orthonormal_basis
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#orthonormal_basis
