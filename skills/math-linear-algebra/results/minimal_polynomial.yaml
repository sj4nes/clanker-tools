id: eigentheory.minimal_polynomial
node: minimal_polynomial
status_label: definition
display: 'm_T is the unique MONIC generator of the ideal {p in F[t] : p(T) = 0}. It divides every annihilating polynomial (in particular p_T, by Cayley-Hamilton), and its roots are exactly the eigenvalues of T.'
parseable: 'm_T := the monic generator of Ann(T) = {p : p(T) = 0};  p(T) = 0  <=>  m_T | p'
field_scope: any_field
choice_grade: choice_free
symbols:
  'm_T': 'type: monic element of F[t]'
  'Ann(T)': 'the annihilator ideal'
type_check_status: well_formed
type_check_note: 'Well-formed as a definite description BECAUSE F[t] is a principal ideal domain (polynomial_ring): the annihilator is a nonzero ideal (nonzero because L(V) is finite-dimensional, so I, T, T^2, ... are dependent), hence generated by a unique monic element.'
hypotheses:
  - 'V finite-dimensional'
preconditions: []
dependencies:
  - 'linear_operator'
  - 'polynomial_ring'
  - 'space_of_linear_maps'
proof:
  technique: 'nonemptiness from dim L(V) = n^2 < infinity; uniqueness of the monic generator from principality of F[t]'
  derives_from: 'polynomial_ring'
  lean_status: cited
  lean_ref: null
uses_choice: false
constructive: true
specialization_cases:
  - 'T = lambda I: m_T = t - lambda, of degree 1, while p_T = (t - lambda)^n'
  - 'J = [[1,1],[0,1]]: m_J = (t-1)^2 = p_J'
  - 'm_T and p_T always have the SAME ROOTS, but with possibly different multiplicities'
counterexamples_when_dropped:
  finite_dimensionality: 'on an infinite-dimensional space an operator need not satisfy any polynomial -- the annihilator can be {0} and there is no minimal polynomial'
  monicity_and_principality: 'without the PID structure of F[t] there would be no single generator, hence no ''the'' minimal polynomial'
common_misuse:
  - 'assuming m_T = p_T: equal only when T is CYCLIC (has a vector whose orbit spans), e.g. a single Jordan block'
  - 'assuming deg m_T tells you diagonalisability directly: what matters is whether m_T has REPEATED factors'
related:
  required_by: ['minimal_polynomial_diagonalisable', 'primary_decomposition', 'nilpotent_operator']
sources:
  - 'hoffman_kunze_2e'
status: reviewed
checks:
  type: validation/type-checks.md#minimal_polynomial
  specialization: validation/specialization-cases.md#minimal_polynomial
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#minimal_polynomial
