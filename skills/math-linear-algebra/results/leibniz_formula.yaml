id: determinants.leibniz_formula
node: leibniz_formula
status_label: proved_theorem
display: 'det A = sum_{sigma in S_n} sgn(sigma) prod_{i=1}^n A_{i, sigma(i)}. A THEOREM identifying the unique normalised alternating form, not the definition.'
parseable: 'det A = sum_{sigma in S_n} sgn(sigma) prod_{i=1}^n A_{i,sigma(i)}'
field_scope: any_field
choice_grade: choice_free
symbols:
  'sigma': 'a permutation, type: element of S_n'
  'n!': 'the number of terms'
type_check_status: well_formed
type_check_note: 'Well-formed; the sum has n! terms, each a product of n entries, one from each row and each column.'
hypotheses:
  - 'A square'
preconditions: []
dependencies:
  - 'determinant'
  - 'determinant_existence_uniqueness'
  - 'permutation_sign'
proof:
  technique: 'this is exactly the formula produced by the uniqueness argument of determinant_existence_uniqueness'
  derives_from: 'determinant_existence_uniqueness'
  lean_status: cited
  lean_ref: null
uses_choice: false
constructive: true
specialization_cases:
  - 'n = 2: two terms, ad - bc'
  - 'n = 3: six terms'
  - 'A triangular: only sigma = id contributes a nonzero product (determinant_triangular)'
counterexamples_when_dropped:
  none_all_hypotheses_essential: 'an identity for square A over any field'
common_misuse:
  - 'using it as an ALGORITHM: n! terms is catastrophic (20! exceeds 10^18). Compute determinants by elimination in O(n^3) via determinant_row_operations and determinant_triangular'
  - 'assuming the formula is the definition, which obscures why det is multiplicative'
related:
  required_by: ['determinant_transpose', 'determinant_triangular', 'laplace_expansion']
sources:
  - 'hoffman_kunze_2e'
status: reviewed
checks:
  type: validation/type-checks.md#leibniz_formula
  specialization: validation/specialization-cases.md#leibniz_formula
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#leibniz_formula
