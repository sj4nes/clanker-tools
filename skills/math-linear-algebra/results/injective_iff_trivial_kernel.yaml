id: linear_maps.injective_iff_trivial_kernel
node: injective_iff_trivial_kernel
status_label: proposition
display: 'A linear map T is injective if and only if ker T = {0}.'
parseable: 'T injective  <=>  ker T = {0}'
field_scope: any_field
choice_grade: choice_free
symbols:
  '{0}': 'the zero subspace of V'
type_check_status: well_formed
type_check_note: 'Well-formed. The reduction of a global condition (injectivity, a statement about all pairs) to a local one (a single subspace being trivial) is available ONLY for linear maps, and it is what makes injectivity computable by elimination.'
hypotheses:
  - 'T linear'
preconditions: []
dependencies:
  - 'kernel'
  - 'linear_map'
proof:
  technique: 'T(u) = T(v) iff T(u - v) = 0 iff u - v in ker T'
  derives_from: 'linear_map'
  lean_status: cited
  lean_ref: null
uses_choice: false
constructive: true
specialization_cases:
  - 'V = F^n: T injective iff Ax = 0 has only the trivial solution iff A has full column rank'
counterexamples_when_dropped:
  linearity: 'for nonlinear f, f^{-1}(0) = {0} does not give injectivity: x -> x^2 on R has only 0 in its zero set but is not injective'
common_misuse:
  - 'applying the criterion to an affine map x -> Ax + b: injectivity is still governed by ker A, but the ''zero set'' is not the kernel'
related:
  required_by: ['injective_surjective_equivalence']
sources:
  - 'axler_lada_4e'
status: reviewed
checks:
  type: validation/type-checks.md#injective_iff_trivial_kernel
  specialization: validation/specialization-cases.md#injective_iff_trivial_kernel
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#injective_iff_trivial_kernel
