id: matrices.transpose_convention
node: transpose_convention
status_label: definition
display: 'A^T is the TRANSPOSE (A^T)_{ij} = A_{ji}; A^* is the CONJUGATE TRANSPOSE (A^*)_{ij} = conj(A_{ji}). They coincide over R. Every Hermitian statement in this capsule says which one it means.'
parseable: '(A^T)_{ij} = A_{ji};  (A^*)_{ij} = conj(A_{ji});  A^* = A^T when A is real'
choice_grade: choice_free
symbols:
  'A^T': 'transpose, type: F^{m x n} -> F^{n x m}'
  'A^*': 'conjugate transpose, type: C^{m x n} -> C^{n x m}'
type_check_status: well_formed
type_check_note: 'A convention. The substantive point is that the ADJOINT with respect to an inner product is A^*, not A^T, over C -- adjoint_operator proves this, and getting it wrong makes the complex spectral theorem false.'
hypotheses: []
preconditions: []
dependencies: []
uses_choice: false
constructive: true
specialization_cases:
  - 'over R the two coincide, which is why the statistics-facing half of the capsule can be written entirely with A^T'
counterexamples_when_dropped:
  none_all_hypotheses_essential: 'a convention; the failure mode is using A^T over C, under which A^T A need not be positive semidefinite -- take A = [[1, i]], where A^T A has a zero eigenvalue direction while A^* A does not'
common_misuse:
  - 'defining a complex symmetric matrix as A^T = A and expecting real eigenvalues: that is the HERMITIAN condition A^* = A, and complex-symmetric matrices can have any spectrum'
related:
  dual_of: ['dual_map']
sources:
  - 'horn_johnson_2e'
status: reviewed
