id: eigentheory.distinct_eigenvalues_diagonalisable
node: distinct_eigenvalues_diagonalisable
status_label: corollary
display: 'If A in F^{n x n} has n DISTINCT eigenvalues in F then A is diagonalisable. SUFFICIENT, NOT NECESSARY.'
parseable: 'n distinct eigenvalues in F  =>  diagonalisable;  converse FALSE'
field_scope: any_field
choice_grade: choice_free
symbols:
  'n': 'the size, equal to the number of distinct eigenvalues'
type_check_status: well_formed
type_check_note: 'Well-formed. Note the eigenvalues must lie IN F: n distinct complex eigenvalues do not diagonalise a real matrix over R.'
hypotheses:
  - 'n distinct eigenvalues, all in F'
preconditions: []
dependencies:
  - 'diagonalisable'
  - 'dimension'
  - 'distinct_eigenvalues_independent'
proof:
  technique: 'the n eigenvectors are independent by distinct_eigenvalues_independent, hence a basis by the dimension count'
  derives_from: 'distinct_eigenvalues_independent'
  lean_status: cited
  lean_ref: null
uses_choice: false
constructive: true
specialization_cases:
  - 'n = 2 with tr^2 != 4 det over R: two distinct real roots, so diagonalisable'
  - 'generic matrices have distinct eigenvalues, which is why diagonalisability is ''typical'' -- but not robust, since the defective matrices are exactly where numerical eigenvector computation becomes ill-conditioned'
counterexamples_when_dropped:
  necessity_fails: 'I_n has one eigenvalue repeated n times and is diagonal. The converse is false and assuming it is the standard error'
  eigenvalues_in_F: '[[0,-1],[1,0]] has two distinct eigenvalues +-i, but not in R, and it is not diagonalisable over R'
common_misuse:
  - 'concluding non-diagonalisability from repeated eigenvalues'
sources:
  - 'axler_lada_4e'
status: reviewed
checks:
  type: validation/type-checks.md#distinct_eigenvalues_diagonalisable
  specialization: validation/specialization-cases.md#distinct_eigenvalues_diagonalisable
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#distinct_eigenvalues_diagonalisable
