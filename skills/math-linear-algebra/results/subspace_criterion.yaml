id: vector_spaces.subspace_criterion
node: subspace_criterion
status_label: proposition
display: 'A nonempty subset U of V is a subspace if and only if au + bw is in U for all a, b in F and all u, w in U.'
parseable: 'U != empty;  U subspace <=> (for all a,b in F, u,w in U: au + bw in U)'
field_scope: any_field
choice_grade: choice_free
symbols:
  'a, b': 'arbitrary scalars'
  'u, w': 'arbitrary elements of U'
type_check_status: well_formed
type_check_note: 'Well-formed. The single condition packages both closures; nonemptiness then supplies 0 by taking a = b = 0.'
hypotheses:
  - 'U nonempty'
preconditions: []
dependencies:
  - 'subspace'
proof:
  technique: 'forward by applying the two closures in turn; backward by specialising (a,b) to (1,1) and (a,0)'
  derives_from: 'subspace'
  lean_status: cited
  lean_ref: null
uses_choice: false
constructive: true
specialization_cases:
  - 'a = b = 0 recovers 0 in U; b = 0 recovers closure under scalars; a = b = 1 recovers closure under addition'
counterexamples_when_dropped:
  nonemptiness: 'the empty set satisfies the quantified condition vacuously; without nonemptiness the criterion would wrongly certify it as a subspace'
common_misuse:
  - 'checking only a = b = 1 (closure under addition) and concluding subspace -- see the quadrant counterexample on subspace'
sources:
  - 'axler_lada_4e'
status: reviewed
checks:
  type: validation/type-checks.md#subspace_criterion
  specialization: validation/specialization-cases.md#subspace_criterion
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#subspace_criterion
