id: matrices.conjugate_transpose
node: conjugate_transpose
status_label: definition
display: '(A^*)_{ij} = conj(A_{ji}), the Hermitian adjoint. Over R it equals A^T. It satisfies (AB)^* = B^* A^*, (A^*)^* = A, and (aA)^* = conj(a) A^*.'
parseable: '(A^*)_{ij} = conj(A_{ji});  (AB)^* = B^* A^*;  (aA)^* = conj(a) A^*'
field_scope: real_or_complex
choice_grade: choice_free
symbols:
  'A^*': 'type: element of C^{n x m}'
  'conj': 'complex conjugation'
type_check_status: well_formed
type_check_note: 'Well-formed. Note A -> A^* is conjugate-linear, not linear -- the scalar comes out conjugated, so A^* is not a linear function of A over C.'
hypotheses: []
preconditions: []
dependencies:
  - 'complex_number'
  - 'transpose'
  - 'transpose_convention'
proof:
  technique: 'entrywise, combining transpose with the ring homomorphism property of conjugation'
  derives_from: 'transpose'
  lean_status: cited
  lean_ref: null
uses_choice: false
constructive: true
specialization_cases:
  - 'A real: A^* = A^T, which is why the whole statistics-facing half of the capsule can be written with T'
  - 'A^*A is always positive SEMIdefinite with (A^*A)^* = A^*A -- the fact singular_values rests on'
counterexamples_when_dropped:
  conjugation: 'with A = [[1, i]] (1x2), A^T A = [[1, i],[i, -1]] has determinant 0 and is singular, while A^* A = [[1, -i],[i, 1]] is positive semidefinite of rank 1. Dropping the conjugate destroys positive semidefiniteness, hence the SVD and every least-squares argument over C'
common_misuse:
  - 'defining Hermitian as A^T = A over C: that is complex-symmetric, a genuinely different and far worse-behaved class (complex symmetric matrices need not be diagonalisable)'
related:
  required_by: ['adjoint_operator', 'self_adjoint', 'singular_values']
sources:
  - 'horn_johnson_2e'
status: reviewed
checks:
  type: validation/type-checks.md#conjugate_transpose
  specialization: validation/specialization-cases.md#conjugate_transpose
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#conjugate_transpose
