id: vector_spaces.quotient_space
node: quotient_space
status_label: constructive_result
display: 'For a subspace U of V, the quotient V/U is the set of cosets v + U with (v+U) + (w+U) = (v+w) + U and a(v+U) = av + U. WELL-DEFINED precisely because U is a subspace.'
parseable: 'V/U := {v + U : v in V};  (v+U)+(w+U) := (v+w)+U;  a(v+U) := av+U'
field_scope: any_field
choice_grade: choice_free
symbols:
  'v + U': 'a coset, type: element of the quotient set V/U'
  'pi': 'the canonical projection V -> V/U, v -> v + U, linear and surjective'
type_check_status: well_formed
type_check_note: 'The type check IS the well-definedness check, as in every quotient construction: if v + U = v'' + U and w + U = w'' + U then (v+w) - (v''+w'') = (v - v'') + (w - w'') lies in U by closure under addition; and av - av'' = a(v - v'') lies in U by closure under scalars. Both closures are used, one per operation.'
hypotheses:
  - 'U a subspace of V'
preconditions: []
dependencies:
  - 'quotient_set'
  - 'subspace'
  - 'vector_space'
proof:
  technique: 'verify the vector-space axioms on cosets; each reduces to the corresponding axiom in V applied to representatives'
  derives_from: 'quotient_set'
  lean_status: cited
  lean_ref: null
well_definedness: 'Each operation is defined on representatives; independence of representative follows from U being closed under + (for addition) and under scalar multiplication (for scaling). A subset failing either closure yields no quotient.'
uses_choice: false
constructive: true
specialization_cases:
  - 'U = {0}: V/U is isomorphic to V'
  - 'U = V: V/U = {0}'
  - 'V = R^2, U = the x-axis: V/U is the set of horizontal lines, isomorphic to R by the y-value'
counterexamples_when_dropped:
  U_being_a_subspace: 'if U is merely a subset closed under addition but not scaling -- say the nonnegative x-axis in R^2 -- the scalar operation on cosets is not well-defined, since v + U = v'' + U no longer implies av + U = av'' + U'
  closure_under_addition: 'similarly, a subset closed under scaling but not addition (the union of the axes) breaks coset addition'
common_misuse:
  - 'picturing V/U as a subspace of V: it is not, it is a space of COSETS. A complement W with V = U (+) W is isomorphic to V/U but is a genuine choice, not canonical'
  - 'assuming the projection has a canonical section: it does not without extra structure (an inner product supplies one)'
related:
  required_by: ['first_isomorphism_theorem', 'quotient_dimension']
sources:
  - 'hoffman_kunze_2e'
  - 'axler_lada_4e'
status: reviewed
checks:
  type: validation/type-checks.md#quotient_space
  specialization: validation/specialization-cases.md#quotient_space
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#quotient_space
