id: foundations.polynomial_ring
node: polynomial_ring
status_label: proved_theorem
display: 'F[t], the ring of polynomials in one indeterminate over a field F: a Euclidean domain under degree, so it has division with remainder, gcds, and unique factorisation into irreducibles. Every ideal is principal.'
parseable: 'F[t] Euclidean under deg;  for g != 0, f = qg + r with r = 0 or deg r < deg g;  every ideal = (m) for a unique monic m'
field_scope: any_field
choice_grade: choice_free
symbols:
  'F[t]': 'the polynomial ring, type: commutative ring, in fact a PID'
  'deg': 'degree, type: function F[t]\{0} -> N'
  '(m)': 'the principal ideal generated by m'
type_check_status: well_formed
type_check_note: 'Well-formed over any field. Principality is what makes ''the'' minimal polynomial a definite description: the annihilator of an operator is an ideal, hence generated by a unique monic element.'
hypotheses: []
preconditions: []
dependencies: []
proof:
  technique: 'cited; the division algorithm is induction on degree, principality follows by taking a nonzero element of least degree'
  derives_from: null
  lean_status: cited
  lean_ref: null
uses_choice: false
constructive: true
specialization_cases:
  - 'F = R, deg g = 1: division with remainder is evaluation, f(t) = q(t)(t - a) + f(a) -- the factor theorem'
counterexamples_when_dropped:
  F_being_a_field: 'over a general commutative ring, Z[t] say, division with remainder fails (t does not divide 2t + 1 with remainder of lower degree) and ideals need not be principal. Minimal polynomials of matrices over a ring are correspondingly badly behaved -- see smith_normal_form_boundary'
common_misuse:
  - 'assuming irreducible means degree 1: that holds only over an algebraically closed field'
related:
  required_by: ['characteristic_polynomial', 'minimal_polynomial', 'cayley_hamilton']
sources:
  - 'hoffman_kunze_2e'
  - 'dummit_foote_3e'
status: reviewed
checks:
  type: validation/type-checks.md#polynomial_ring
  specialization: validation/specialization-cases.md#polynomial_ring
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#polynomial_ring
