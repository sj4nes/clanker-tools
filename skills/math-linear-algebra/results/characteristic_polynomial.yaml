id: eigentheory.characteristic_polynomial
node: characteristic_polynomial
status_label: definition
display: 'p_A(t) = det(tI - A) in F[t], MONIC of degree n. It is a similarity invariant, so p_T is well-defined for an operator T by taking any matrix representation.'
parseable: 'p_A(t) := det(tI - A);  monic, deg n;  p_{P^{-1}AP} = p_A'
field_scope: any_field
choice_grade: choice_free
symbols:
  'p_A': 'type: monic element of F[t] of degree n'
  't': 'the indeterminate'
type_check_status: well_formed
type_check_note: 'Well-formed: tI - A is a matrix over the commutative ring F[t], and the determinant of a matrix over a commutative ring is defined by the same Leibniz formula. Monicity of degree n follows because the identity permutation contributes prod(t - A_{ii}).'
hypotheses:
  - 'A square'
preconditions: []
dependencies:
  - 'characteristic_polynomial_convention'
  - 'determinant'
  - 'determinant_similarity_invariant'
  - 'matrix_of_linear_map'
  - 'polynomial_ring'
proof:
  technique: 'similarity invariance: det(tI - P^{-1}AP) = det(P^{-1}(tI - A)P) = det(tI - A) by determinant_similarity_invariant applied over F[t]'
  derives_from: 'determinant_similarity_invariant'
  lean_status: dim_core
  lean_ref: 'LinAlg.charpoly_2 (n = 2, universal in t)'
uses_choice: false
constructive: true
specialization_cases:
  - 'n = 1: p(t) = t - a'
  - 'n = 2: p(t) = t^2 - tr(A) t + det(A)'
  - 'A triangular: p(t) = prod_i (t - A_{ii}), by determinant_triangular'
counterexamples_when_dropped:
  the_sign_convention: 'under det(A - tI) the polynomial is (-1)^n p_A, with the same roots but different coefficient signs -- see characteristic_polynomial_convention'
  does_not_determine_similarity: '[[1,1],[0,1]] and I_2 share p(t) = (t-1)^2 but are not similar. The characteristic polynomial is an invariant, not a complete one (similar_invariants)'
common_misuse:
  - 'computing p_A by expanding det(tI - A) symbolically for large n: use the eigenvalues if known, or an algorithm like Faddeev-LeVerrier'
  - 'treating p_A as determining A up to similarity'
related:
  required_by: ['char_poly_roots_are_eigenvalues', 'cayley_hamilton', 'algebraic_geometric_multiplicity']
sources:
  - 'hoffman_kunze_2e'
  - 'horn_johnson_2e'
status: reviewed
checks:
  type: validation/type-checks.md#characteristic_polynomial
  specialization: validation/specialization-cases.md#characteristic_polynomial
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#characteristic_polynomial
