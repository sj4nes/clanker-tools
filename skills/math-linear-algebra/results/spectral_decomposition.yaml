id: spectral.spectral_decomposition
node: spectral_decomposition
status_label: corollary
display: 'A self-adjoint A equals sum_i lambda_i P_i over its DISTINCT eigenvalues, where P_i is the orthogonal projection onto E_{lambda_i}. The P_i are self-adjoint idempotents with P_iP_j = 0 for i != j and sum_i P_i = I. Consequently f(A) = sum_i f(lambda_i) P_i for any function f on the spectrum.'
parseable: 'A = sum_i lambda_i P_i;  P_i^2 = P_i = P_i^*;  P_iP_j = 0 (i != j);  sum P_i = I;  f(A) = sum f(lambda_i) P_i'
field_scope: real_or_complex
choice_grade: choice_free
symbols:
  'P_i': 'the spectral projections'
  'f(A)': 'the functional calculus'
type_check_status: well_formed
type_check_note: 'Well-formed; the sum is over DISTINCT eigenvalues, so the number of terms is at most n and typically fewer. The functional calculus f(A) is well-defined because the P_i are a resolution of the identity.'
hypotheses:
  - 'A self-adjoint'
  - 'finite-dimensional'
preconditions: []
dependencies:
  - 'direct_sum'
  - 'eigenspace'
  - 'orthogonal_projection'
  - 'projection_matrix_characterisation'
  - 'spectral_theorem_symmetric'
proof:
  technique: 'group the columns of Q in spectral_theorem_symmetric by eigenvalue; P_i = Q_iQ_i^T for the corresponding block'
  derives_from: 'spectral_theorem_symmetric'
  lean_status: cited
  lean_ref: null
uses_choice: false
constructive: true
specialization_cases:
  - 'A with distinct eigenvalues: each P_i is a rank-one projection q_iq_i^T'
  - 'f(t) = t^k: recovers A^k = sum lambda_i^k P_i'
  - 'f(t) = 1/t on an invertible A: A^{-1} = sum (1/lambda_i) P_i'
  - 'f(t) = e^t: the matrix exponential in closed form'
counterexamples_when_dropped:
  self_adjointness: 'for a general diagonalisable A the spectral projections are OBLIQUE (P_i = v_iw_i^* with w the LEFT eigenvectors) and are not self-adjoint; the resolution of the identity still holds but the geometry is skewed. For a defective A no such decomposition exists at all'
  distinctness_of_the_lambda_i: 'summing over eigenvalues WITH multiplicity would double-count the projections'
common_misuse:
  - 'using f(A) = sum f(lambda_i)P_i for a defective matrix'
  - 'computing the matrix exponential this way for a non-diagonalisable A'
applications:
  - 'the matrix functional calculus: exp(At) for linear ODEs, A^{1/2} for whitening, and the matrix square root used to standardise a multivariate normal'
  - 'Cochran''s theorem in statistics is exactly the spectral resolution of I into orthogonal idempotents'
related:
  special_case_of: ['spectral_theorem_symmetric']
sources:
  - 'horn_johnson_2e'
status: reviewed
checks:
  type: validation/type-checks.md#spectral_decomposition
  specialization: validation/specialization-cases.md#spectral_decomposition
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#spectral_decomposition
