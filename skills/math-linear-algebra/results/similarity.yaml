id: matrices.similarity
node: similarity
status_label: definition
display: 'A ~ B if B = P^{-1}AP for some invertible P. An equivalence relation whose classes are exactly the operators on an n-dimensional space, one class per operator up to choice of basis.'
parseable: 'A ~ B  <=>  exists invertible P with B = P^{-1} A P'
field_scope: any_field
choice_grade: choice_free
symbols:
  '~': 'similarity, type: equivalence relation on F^{n x n}'
type_check_status: well_formed
type_check_note: 'Well-formed as an equivalence relation: reflexive with P = I, symmetric via P^{-1}, transitive by composing. The correspondence with operators is exactly change_of_basis.'
hypotheses: []
preconditions: []
dependencies:
  - 'change_of_basis'
  - 'equivalence_relation'
  - 'invertible_matrix'
proof:
  technique: 'equivalence-relation axioms via the group structure of invertible matrices'
  derives_from: 'change_of_basis'
  lean_status: cited
  lean_ref: null
uses_choice: false
constructive: true
specialization_cases:
  - 'P a permutation matrix: similarity by simultaneous row and column permutation'
  - 'A diagonalisable: A is similar to a diagonal matrix'
counterexamples_when_dropped:
  invertibility_of_P: 'with singular P the relation is neither symmetric nor transitive'
  similarity_versus_congruence: 'P^{-1}AP and P^T A P agree only when P is ORTHOGONAL. Similarity preserves eigenvalues; congruence preserves only inertia. Confusing them is the standard quadratic-form error -- see congruence'
common_misuse:
  - 'using congruence to compute eigenvalues, or similarity to classify quadratic forms'
  - 'assuming similar matrices are equal in any entrywise sense: they share invariants only (similar_invariants)'
related:
  contrasts_with: ['congruence']
  required_by: ['similar_invariants', 'diagonalisable']
sources:
  - 'hoffman_kunze_2e'
  - 'horn_johnson_2e'
status: reviewed
checks:
  type: validation/type-checks.md#similarity
  specialization: validation/specialization-cases.md#similarity
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#similarity
