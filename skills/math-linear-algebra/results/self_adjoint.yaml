id: spectral.self_adjoint
node: self_adjoint
status_label: definition
display: 'T is self-adjoint (Hermitian) if T = T^*; over R this reads A = A^T (symmetric). Equivalently <Tv,w> = <v,Tw> for all v, w, and over C equivalently <Tv,v> is REAL for every v.'
parseable: 'T = T^*;  over R: A^T = A;  <Tv,w> = <v,Tw>;  over C: <Tv,v> in R for all v'
field_scope: real_or_complex
choice_grade: choice_free
symbols:
  'T^*': 'the adjoint'
type_check_status: well_formed
type_check_note: 'Well-formed for an OPERATOR (T^* has the same domain and codomain only then). The ''real quadratic form'' characterisation is a COMPLEX phenomenon: over R, <Tv,v> is automatically real for every T, so that criterion is vacuous there.'
hypotheses:
  - 'T in L(V)'
  - 'V an inner product space'
preconditions: []
dependencies:
  - 'adjoint_operator'
  - 'conjugate_transpose'
  - 'transpose_convention'
proof:
  technique: 'the equivalences from the defining property of the adjoint; the complex real-form criterion by polarisation'
  derives_from: 'adjoint_operator'
  lean_status: cited
  lean_ref: null
uses_choice: false
constructive: true
specialization_cases:
  - 'orthogonal projections are self-adjoint (projection_matrix_characterisation)'
  - 'covariance matrices and Gram matrices are real symmetric'
  - 'a real DIAGONAL matrix is self-adjoint'
counterexamples_when_dropped:
  the_complex_criterion_is_complex_only: 'over R, <Av,v> is real for EVERY A, so it cannot detect symmetry. Indeed [[0,-1],[1,0]] has <Av,v> = 0 for all v and is not symmetric. Over C the criterion is genuinely equivalent -- an asymmetry worth remembering'
  complex_symmetric_is_not_Hermitian: 'A^T = A over C is a different, badly behaved class: [[1,i],[i,-1]] is complex symmetric, has p(t) = t^2, and is NILPOTENT -- nothing like a Hermitian matrix'
common_misuse:
  - 'defining Hermitian as A^T = A over C'
  - 'using the ''real quadratic form'' test over R, where it is vacuous'
related:
  required_by: ['spectral_theorem_symmetric', 'positive_definite', 'normal_matrix', 'rayleigh_quotient']
sources:
  - 'axler_lada_4e'
  - 'horn_johnson_2e'
status: reviewed
checks:
  type: validation/type-checks.md#self_adjoint
  specialization: validation/specialization-cases.md#self_adjoint
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#self_adjoint
