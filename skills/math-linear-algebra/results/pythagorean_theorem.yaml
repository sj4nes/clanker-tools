id: inner_product.pythagorean_theorem
node: pythagorean_theorem
status_label: proposition
display: 'If u perp v then ||u+v||^2 = ||u||^2 + ||v||^2. Over R the converse holds; over C the converse gives only Re<u,v> = 0.'
parseable: 'u perp v  =>  ||u+v||^2 = ||u||^2 + ||v||^2;  over R the converse holds, over C it gives Re<u,v> = 0'
field_scope: real_or_complex
choice_grade: choice_free
symbols:
  'Re<u,v>': 'the real part'
type_check_status: well_formed
type_check_note: 'Well-formed. The asymmetry between R and C is genuine: expanding gives ||u+v||^2 = ||u||^2 + 2Re<u,v> + ||v||^2, and only the REAL PART appears.'
hypotheses:
  - 'u perp v for the forward direction'
preconditions: []
dependencies:
  - 'induced_norm'
  - 'orthogonality'
proof:
  technique: 'expand <u+v, u+v> using linearity and conjugate-symmetry; the cross terms sum to 2 Re<u,v>'
  derives_from: 'induced_norm'
  lean_status: dim_core
  lean_ref: 'LinAlg.pythagoras (n = 2)'
uses_choice: false
constructive: true
specialization_cases:
  - 'extends by induction to any finite orthogonal family: ||sum v_i||^2 = sum ||v_i||^2'
  - 'with u = P_U v and v - P_U v, it gives ||v||^2 = ||P_U v||^2 + ||v - P_U v||^2 -- the decomposition behind best_approximation and behind the ANOVA sum-of-squares identity'
counterexamples_when_dropped:
  the_complex_converse: 'in C^1 take u = 1 and v = i: <u,v> = conj(i) = -i, so Re<u,v> = 0 and ||u+v||^2 = |1+i|^2 = 2 = 1 + 1. Pythagoras holds, yet <u,v> != 0 so the vectors are NOT orthogonal'
common_misuse:
  - 'inferring orthogonality from the Pythagorean identity over C'
related:
  required_by: ['bessel_inequality', 'best_approximation']
sources:
  - 'axler_lada_4e'
status: reviewed
checks:
  type: validation/type-checks.md#pythagorean_theorem
  specialization: validation/specialization-cases.md#pythagorean_theorem
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#pythagorean_theorem
