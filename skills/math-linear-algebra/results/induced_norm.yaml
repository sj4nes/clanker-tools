id: inner_product.induced_norm
node: induced_norm
status_label: definition
display: '||v|| = sqrt(<v,v>), well-defined because <v,v> is real and nonnegative. It satisfies ||v|| = 0 iff v = 0, ||av|| = |a| ||v||, and the triangle inequality.'
parseable: '||v|| := sqrt(<v,v>);  ||v|| = 0 <=> v = 0;  ||av|| = |a| ||v||;  ||u+v|| <= ||u|| + ||v||'
field_scope: real_or_complex
choice_grade: choice_free
symbols:
  '||v||': 'type: nonnegative real number'
  '|a|': 'modulus of the scalar'
type_check_status: well_formed
type_check_note: 'Well-formed: the square root is of a nonnegative REAL, guaranteed by conjugate-symmetry (realness) and positive definiteness (nonnegativity). Both axioms are used just to make the definition type-check.'
hypotheses:
  - '<.,.> an inner product'
preconditions: []
dependencies:
  - 'inner_product'
  - 'real_number'
uses_choice: false
constructive: true
specialization_cases:
  - 'F^n standard: ||x|| = sqrt(sum |x_i|^2), the Euclidean norm'
  - '||av|| = |a| ||v|| uses |a|, not a -- over C this matters: ||iv|| = ||v||'
counterexamples_when_dropped:
  positive_definiteness: 'for an indefinite form sqrt(<v,v>) is not even real for some v (Minkowski again)'
  not_every_norm_is_induced: 'the 1-norm and infinity-norm on R^2 are genuine norms but come from NO inner product -- they fail the parallelogram_law, which is exactly the characterisation'
common_misuse:
  - 'applying Cauchy-Schwarz or orthogonal projection in a normed space whose norm is not induced by an inner product (e.g. L^1) -- neither is available there'
related:
  required_by: ['cauchy_schwarz', 'orthonormal_basis', 'best_approximation', 'matrix_norms']
sources:
  - 'axler_lada_4e'
status: reviewed
checks:
  type: validation/type-checks.md#induced_norm
  specialization: validation/specialization-cases.md#induced_norm
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#induced_norm
