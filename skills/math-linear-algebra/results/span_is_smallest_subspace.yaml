id: vector_spaces.span_is_smallest_subspace
node: span_is_smallest_subspace
status_label: proposition
display: 'span(S) is a subspace containing S, and it is contained in every subspace of V containing S. Equivalently, span(S) is the intersection of all subspaces containing S.'
parseable: 'span(S) subspace;  S subset span(S);  (U subspace and S subset U) => span(S) subset U'
field_scope: any_field
choice_grade: choice_free
symbols:
  'U': 'any subspace containing S'
type_check_status: well_formed
type_check_note: 'Well-formed. The two characterisations (constructive: finite combinations; and top-down: intersection of all containing subspaces) are proved equal, which is what licenses calling span(S) ''the subspace generated by S''.'
hypotheses:
  - 'U a subspace containing S'
preconditions: []
dependencies:
  - 'span'
  - 'subspace'
  - 'subspace_criterion'
proof:
  technique: 'closure of span(S) from the criterion; minimality because a subspace containing S is closed under the finite combinations that make up span(S), by induction on the number of terms'
  derives_from: 'subspace_criterion'
  lean_status: cited
  lean_ref: null
uses_choice: false
constructive: true
specialization_cases:
  - 'S a subspace already: then span(S) = S'
counterexamples_when_dropped:
  U_being_a_subspace: 'the minimality claim fails for arbitrary supersets: S is contained in many sets that do not contain span(S)'
common_misuse:
  - 'using the intersection characterisation to compute a span: it is a definition-level equivalence, not an algorithm. Computation goes through gaussian_elimination'
sources:
  - 'axler_lada_4e'
status: reviewed
checks:
  type: validation/type-checks.md#span_is_smallest_subspace
  specialization: validation/specialization-cases.md#span_is_smallest_subspace
  instances: validation/instance-checks.bc
  proof: validation/proof-checks.md#span_is_smallest_subspace
